<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escultura Líquida Sonora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 50%, #16213e 100%);
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        
        canvas {
            display: block;
            touch-action: none;
        }
        
        #info {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff88;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 15px;
            font-size: 13px;
            max-width: 280px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        
        #info.hidden {
            transform: translateX(20px);
            opacity: 0;
            pointer-events: none;
        }
        
        #info h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        #info p {
            margin: 8px 0;
            line-height: 1.5;
        }
        
        .control {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        
        button {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.3s;
            touch-action: manipulation;
            user-select: none;
        }
        
        button:active {
            transform: scale(0.95);
            background: rgba(0, 255, 136, 0.4);
        }
        
        .toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 255, 136, 0.3);
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 12px 18px;
            border-radius: 50px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            #info {
                max-width: 240px;
                font-size: 12px;
                padding: 15px;
            }
            
            .toggle-btn {
                padding: 10px 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-btn" id="toggleInfo">🎮 Controles</button>
    
    <div id="info">
        <h2>🎵 Escultura Líquida</h2>
        <p><strong>🖱️ Arrastra:</strong> Gira la escultura</p>
        <p><strong>🎤 Click:</strong> Genera pulso sonoro</p>
        <p><strong>⚡ Scroll:</strong> Acerca/Aleja</p>
        <div class="control">
            <button id="morphBtn">🔄 Cambiar Forma</button>
        </div>
        <div class="control">
            <button id="colorBtn">🎨 Cambiar Color</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuración
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 5;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ff88, 2, 100);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff0088, 2, 100);
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0x0088ff, 2, 100);
        pointLight3.position.set(0, 5, -5);
        scene.add(pointLight3);

        // Escultura líquida principal
        let geometry = new THREE.IcosahedronGeometry(2, 4);
        const material = new THREE.MeshPhongMaterial({
            color: 0x00ff88,
            emissive: 0x00ff88,
            emissiveIntensity: 0.2,
            shininess: 100,
            wireframe: false,
            flatShading: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Guardar posiciones originales
        const originalPositions = geometry.attributes.position.array.slice();
        const vertexCount = geometry.attributes.position.count;

        // Ondas de partículas
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 1000;
        const particlePositions = new Float32Array(particleCount * 3);
        const particleVelocities = [];

        for(let i = 0; i < particleCount * 3; i += 3) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const radius = 3 + Math.random() * 2;
            
            particlePositions[i] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i + 2] = radius * Math.cos(phi);
            
            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02,
                angle: Math.random() * Math.PI * 2,
                speed: 0.01 + Math.random() * 0.02
            });
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x00ff88,
            size: 0.05,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Variables de animación
        let time = 0;
        let morphMode = 0;
        let pulseWaves = [];
        let colorMode = 0;

        const colorPalettes = [
            { main: 0x00ff88, light1: 0x00ff88, light2: 0xff0088, light3: 0x0088ff },
            { main: 0xff6b35, light1: 0xff6b35, light2: 0xf7931e, light3: 0xfdc500 },
            { main: 0x00d4ff, light1: 0x00d4ff, light2: 0x7b2cbf, light3: 0xff006e },
            { main: 0xff006e, light1: 0xff006e, light2: 0x8338ec, light3: 0x3a86ff }
        ];

        // Clase para ondas de pulso
        class PulseWave {
            constructor() {
                const geometry = new THREE.RingGeometry(0.1, 0.2, 32);
                const material = new THREE.MeshBasicMaterial({
                    color: colorPalettes[colorMode].main,
                    transparent: true,
                    opacity: 1,
                    side: THREE.DoubleSide
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(mesh.position);
                this.scale = 0.1;
                this.speed = 0.1;
                scene.add(this.mesh);
            }

            update() {
                this.scale += this.speed;
                this.mesh.scale.set(this.scale, this.scale, 1);
                this.mesh.material.opacity = Math.max(0, 1 - this.scale / 10);
                return this.mesh.material.opacity > 0;
            }

            remove() {
                scene.remove(this.mesh);
            }
        }

        // Controles de mouse y touch
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };

        function handleStart(clientX, clientY) {
            isDragging = true;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function handleMove(clientX, clientY) {
            if (isDragging) {
                const deltaX = clientX - previousMousePosition.x;
                const deltaY = clientY - previousMousePosition.y;
                
                rotation.y += deltaX * 0.01;
                rotation.x += deltaY * 0.01;
                
                previousMousePosition = { x: clientX, y: clientY };
            }
        }

        function handleEnd() {
            isDragging = false;
        }

        function handleClick(clientX, clientY) {
            if (!isDragging) {
                pulseWaves.push(new PulseWave());
            }
        }

        // Mouse events
        renderer.domElement.addEventListener('mousedown', (e) => {
            handleStart(e.clientX, e.clientY);
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        renderer.domElement.addEventListener('mouseup', () => {
            handleEnd();
        });

        renderer.domElement.addEventListener('click', (e) => {
            handleClick(e.clientX, e.clientY);
        });

        // Touch events
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleStart(touch.clientX, touch.clientY);
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (e) => {
            e.preventDefault();
            const wasClick = !isDragging;
            handleEnd();
            if (wasClick) {
                pulseWaves.push(new PulseWave());
            }
        }, { passive: false });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(2, Math.min(10, camera.position.z));
        });

        // Botones
        document.getElementById('morphBtn').addEventListener('click', () => {
            morphMode = (morphMode + 1) % 4;
        });

        document.getElementById('colorBtn').addEventListener('click', () => {
            colorMode = (colorMode + 1) % colorPalettes.length;
            const palette = colorPalettes[colorMode];
            material.color.setHex(palette.main);
            material.emissive.setHex(palette.main);
            particleMaterial.color.setHex(palette.main);
            pointLight1.color.setHex(palette.light1);
            pointLight2.color.setHex(palette.light2);
            pointLight3.color.setHex(palette.light3);
        });

        // Toggle panel
        document.getElementById('toggleInfo').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('info').classList.toggle('hidden');
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animación
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Morfeo líquido
            const positions = geometry.attributes.position.array;
            for(let i = 0; i < vertexCount; i++) {
                const i3 = i * 3;
                const x = originalPositions[i3];
                const y = originalPositions[i3 + 1];
                const z = originalPositions[i3 + 2];

                let offset = 0;
                switch(morphMode) {
                    case 0: // Ondulante
                        offset = Math.sin(x * 2 + time) * Math.cos(y * 2 + time) * 0.3;
                        break;
                    case 1: // Espiral
                        offset = Math.sin(Math.atan2(y, x) * 3 + time) * 0.4;
                        break;
                    case 2: // Pulsante
                        offset = Math.sin(time * 2) * 0.3;
                        break;
                    case 3: // Caótico
                        offset = Math.sin(x * y * z * 0.5 + time) * 0.4;
                        break;
                }

                const length = Math.sqrt(x * x + y * y + z * z);
                positions[i3] = x + (x / length) * offset;
                positions[i3 + 1] = y + (y / length) * offset;
                positions[i3 + 2] = z + (z / length) * offset;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals();

            // Rotación basada en arrastre
            mesh.rotation.x = rotation.x + time * 0.1;
            mesh.rotation.y = rotation.y + time * 0.15;

            // Animar partículas
            const pPositions = particleGeometry.attributes.position.array;
            for(let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const vel = particleVelocities[i];
                
                vel.angle += vel.speed;
                const radius = 3 + Math.sin(vel.angle) * 0.5;
                
                pPositions[i3] += vel.x;
                pPositions[i3 + 1] += vel.y;
                pPositions[i3 + 2] += vel.z;

                // Mantener partículas en órbita
                const dist = Math.sqrt(
                    pPositions[i3] ** 2 + 
                    pPositions[i3 + 1] ** 2 + 
                    pPositions[i3 + 2] ** 2
                );
                
                if(dist > 6 || dist < 2) {
                    const factor = radius / dist;
                    pPositions[i3] *= factor;
                    pPositions[i3 + 1] *= factor;
                    pPositions[i3 + 2] *= factor;
                }
            }
            particleGeometry.attributes.position.needsUpdate = true;
            particles.rotation.y = time * 0.1;

            // Actualizar luces
            pointLight1.position.x = Math.sin(time * 0.7) * 5;
            pointLight1.position.y = Math.cos(time * 0.5) * 5;
            
            pointLight2.position.x = Math.cos(time * 0.6) * 5;
            pointLight2.position.z = Math.sin(time * 0.8) * 5;

            // Actualizar ondas de pulso
            pulseWaves = pulseWaves.filter(wave => {
                const alive = wave.update();
                if (!alive) wave.remove();
                return alive;
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
