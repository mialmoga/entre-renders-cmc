<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
title>Proto-Life Chemistry</title>
<style>
html,body{
  margin:0;
  background:#050507;
  overflow:hidden;
  font-family:system-ui;
  touch-action:none;
}

canvas{ display:block; }

.panel{
  position:fixed;
  top:10px;
  left:10px;
  background:#0b0f12cc;
  backdrop-filter: blur(6px);
  padding:10px;
  border-radius:14px;
  color:#9fffd6;
  font-size:12px;
}

button{
  margin:2px;
  background:#10a37f;
  border:none;
  color:white;
  padding:4px 8px;
  border-radius:8px;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div class="panel">
⚗️ Proto-Life<br>
<button onclick="spawnAtoms()">+ átomos</button>
<button onclick="spawnCells()">+ células</button>
<button onclick="heatPulse()">🔥 calor</button>
<button onclick="toggleUI()">👁️</button>
<div id="stats"></div>
</div>

<script>
const canvas = document.getElementById("c")
const ctx = canvas.getContext("2d")

let W,H
function resize(){
  W = canvas.width = innerWidth
  H = canvas.height = innerHeight
}
resize()
onresize = resize

// =========================
// ENTIDADES
// =========================

const atoms=[]
const bonds=[]
const cells=[]

class Atom{
  constructor(type,x,y){
    this.type=type
    this.x=x
    this.y=y
    this.vx=(Math.random()-0.5)*0.8
    this.vy=(Math.random()-0.5)*0.8
  }
}

class Bond{
  constructor(a,b){
    this.a=a
    this.b=b
  }
}

class Cell{
  constructor(x,y){
    this.x=x
    this.y=y
    this.energy=40
  }
}

// =========================
// SPAWN
// =========================

function spawnAtoms(n=80){
  const types=["H","O","C"]
  for(let i=0;i<n;i++){
    atoms.push(new Atom(
      types[Math.floor(Math.random()*3)],
      Math.random()*W,
      Math.random()*H
    ))
  }
}

function spawnCells(n=5){
  for(let i=0;i<n;i++){
    cells.push(new Cell(Math.random()*W,Math.random()*H))
  }
}

function heatPulse(){
  for(const a of atoms){
    a.vx+=(Math.random()-0.5)*4
    a.vy+=(Math.random()-0.5)*4
  }
}

// =========================
// FÍSICA SIMPLE
// =========================

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y)
}

function tryBond(a,b){
  if(dist(a,b)<14 && Math.random()<0.02){
    bonds.push(new Bond(a,b))
  }
}

function updateAtoms(){

  for(const a of atoms){

    a.x+=a.vx
    a.y+=a.vy

    a.vx*=0.99
    a.vy*=0.99

    if(a.x<0||a.x>W) a.vx*=-1
    if(a.y<0||a.y>H) a.vy*=-1
  }

  // intentar enlaces locales
  for(let i=0;i<atoms.length;i++){
    for(let j=i+1;j<i+10 && j<atoms.length;j++){
      tryBond(atoms[i],atoms[j])
    }
  }
}

// =========================
// CÉLULAS
// =========================

function updateCells(){

  for(const c of cells){

    // moverse random
    c.x+=(Math.random()-0.5)*2
    c.y+=(Math.random()-0.5)*2

    c.energy-=0.02

    // comer moléculas grandes
    for(const b of bonds){
      const mx=(b.a.x+b.b.x)/2
      const my=(b.a.y+b.b.y)/2

      if(Math.hypot(mx-c.x,my-c.y)<10){
        c.energy+=8
      }
    }

    // reproducción
    if(c.energy>100){
      c.energy*=0.5
      cells.push(new Cell(c.x,c.y))
    }
  }
}

// =========================
// RENDER
// =========================

function draw(){

  ctx.fillStyle="rgba(5,5,7,0.2)"
  ctx.fillRect(0,0,W,H)

  // enlaces
  ctx.strokeStyle="#10a37f33"
  for(const b of bonds){
    ctx.beginPath()
    ctx.moveTo(b.a.x,b.a.y)
    ctx.lineTo(b.b.x,b.b.y)
    ctx.stroke()
  }

  // átomos
  for(const a of atoms){
    ctx.beginPath()

    const color={
      H:"#aaa",
      O:"#5ccfff",
      C:"#111"
    }[a.type]

    ctx.fillStyle=color
    ctx.arc(a.x,a.y,3,0,6.28)
    ctx.fill()
  }

  // células
  for(const c of cells){
    ctx.beginPath()
    ctx.fillStyle="#10ff9a"
    ctx.arc(c.x,c.y,6,0,6.28)
    ctx.fill()
  }

  stats.textContent=
    `átomos ${atoms.length} | enlaces ${bonds.length} | células ${cells.length}`
}

// =========================
// LOOP
// =========================

function loop(){
  updateAtoms()
  updateCells()
  draw()
  requestAnimationFrame(loop)
}
loop()

// touch → energía local
canvas.addEventListener("pointermove",e=>{
  for(const a of atoms){
    const d=Math.hypot(a.x-e.clientX,a.y-e.clientY)
    if(d<60){
      a.vx+=(a.x-e.clientX)*0.02
      a.vy+=(a.y-e.clientY)*0.02
    }
  }
})

function toggleUI(){
  document.querySelector(".panel").style.display =
    document.querySelector(".panel").style.display==="none"?"block":"none"
}
</script>
</body>
</html>
