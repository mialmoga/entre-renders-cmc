<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NebulaSurf</title>
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.85); color:white; font-family:sans-serif;
    }
    input, button { margin:10px; padding:8px; }
    canvas { display:block; }
    #hud {
      position:absolute; top:10px; left:10px; color:white; font-family:sans-serif;
    }
  </style>
</head>
<body>
<div id="overlay">
  <h1>🌌 NebulaSurf</h1>
  <p>Sube tu MP3 para viajar por la constelación</p>
  <input type="file" id="fileInput" accept="audio/mpeg,audio/*">
  <button id="demoBtn">Demo Track</button>
</div>
<div id="hud">Score: <span id="score">0</span></div>
<canvas id="gameCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>

<script>
let scene, camera, renderer, tunnel, stars = [], analyser, audioCtx, source;
let playing = false, score = 0;
let player, lane = 0; // -1 izquierda, 0 centro, 1 derecha
let obstacles = [];

function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  renderer = new THREE.WebGLRenderer({canvas:document.getElementById("gameCanvas")});
  renderer.setSize(window.innerWidth, window.innerHeight);

  // Tunnel
  const geometry = new THREE.TorusGeometry(10, 2, 16, 100);
  const material = new THREE.MeshBasicMaterial({color:0x4444ff, wireframe:true});
  tunnel = new THREE.Mesh(geometry, material);
  scene.add(tunnel);

  // Stars
  for(let i=0;i<200;i++){
    let star = new THREE.Mesh(
      new THREE.SphereGeometry(0.05,8,8),
      new THREE.MeshBasicMaterial({color:0xffffff})
    );
    star.position.set((Math.random()-0.5)*20,(Math.random()-0.5)*20,(Math.random()-0.5)*20);
    scene.add(star);
    stars.push(star);
  }

  // Player
  player = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.5,0.5),
    new THREE.MeshBasicMaterial({color:0xff00ff})
  );
  player.position.z = 4;
  scene.add(player);

  animate();
}

function animate(){
  requestAnimationFrame(animate);
  if(playing && analyser){
    let data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    let avg = data.reduce((a,b)=>a+b)/data.length;
    tunnel.rotation.x += avg/100000;
    tunnel.rotation.y += avg/100000;
    stars.forEach(s=>s.material.color.setHSL(Math.random(),1,0.5));

    // Obstacles movement
    obstacles.forEach((o,i)=>{
      o.position.z += 0.1;
      if(o.position.z>5){
        scene.remove(o);
        obstacles.splice(i,1);
      }
      // Collision
      if(Math.abs(o.position.z-player.position.z)<0.5 && o.lane===lane){
        score++;
        document.getElementById("score").textContent=score;
        scene.remove(o);
        obstacles.splice(i,1);
      }
    });

    // Beat detection: spawn obstacle
    if(avg>100){
      spawnObstacle();
    }
  }
  // Player lane update
  player.position.x = lane*2;
  renderer.render(scene,camera);
}

function spawnObstacle(){
  let lanes=[-1,0,1];
  let chosen=lanes[Math.floor(Math.random()*3)];
  let obs = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.5,0.5),
    new THREE.MeshBasicMaterial({color:0x00ffff})
  );
  obs.position.set(chosen*2,0,-20);
  obs.lane=chosen;
  scene.add(obs);
  obstacles.push(obs);
}

function playBuffer(buffer){
  source = audioCtx.createBufferSource();
  source.buffer = buffer;
  analyser = audioCtx.createAnalyser();
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  source.start();
  playing = true;
  document.getElementById("overlay").style.display="none";
}

function loadAudio(file){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  let reader = new FileReader();
  reader.onload = function(e){
    audioCtx.decodeAudioData(e.target.result)
      .then(buffer => playBuffer(buffer))
      .catch(err => {
        console.error("Decode error:", err);
        alert("No se pudo decodificar el MP3");
      });
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("fileInput").addEventListener("change",e=>{
  if(e.target.files.length>0) loadAudio(e.target.files[0]);
});

document.getElementById("demoBtn").addEventListener("click",()=>{
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  fetch("demo.mp3") // ⚠️ usa un archivo local confiable
    .then(r=>r.arrayBuffer())
    .then(buf=>{
      audioCtx.decodeAudioData(buf)
        .then(buffer => playBuffer(buffer))
        .catch(err => console.error("Demo decode error:", err));
    });
});

// Controls
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a") lane=Math.max(-1,lane-1);
  if(e.key==="ArrowRight"||e.key==="d") lane=Math.min(1,lane+1);
});

// Touch controls
let startX=null;
window.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;});
window.addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;
  if(startX && endX){
    if(endX-startX>50) lane=Math.min(1,lane+1);
    if(startX-endX>50) lane=Math.max(-1,lane-1);
  }
  startX=null;
});

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

initScene();
</script>
</body>
</html>
