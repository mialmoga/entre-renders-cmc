<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NebulaSurf</title>
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.85); color:white; font-family:sans-serif;
    }
    input, button { margin:10px; padding:8px; }
    canvas { display:block; }
  </style>
</head>
<body>
<div id="overlay">
  <h1>🌌 NebulaSurf</h1>
  <p>Sube tu MP3 para viajar por la constelación</p>
  <input type="file" id="fileInput" accept="audio/mp3">
  <button id="demoBtn">Demo Track</button>
</div>
<canvas id="gameCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>

<script>
let scene, camera, renderer, tunnel, stars = [], analyser, audioCtx, source;
let playing = false;

function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  renderer = new THREE.WebGLRenderer({canvas:document.getElementById("gameCanvas")});
  renderer.setSize(window.innerWidth, window.innerHeight);

  // Tunnel geometry
  const geometry = new THREE.TorusGeometry(10, 2, 16, 100);
  const material = new THREE.MeshBasicMaterial({color:0x4444ff, wireframe:true});
  tunnel = new THREE.Mesh(geometry, material);
  scene.add(tunnel);

  // Stars
  for(let i=0;i<200;i++){
    let star = new THREE.Mesh(
      new THREE.SphereGeometry(0.05,8,8),
      new THREE.MeshBasicMaterial({color:0xffffff})
    );
    star.position.set((Math.random()-0.5)*20,(Math.random()-0.5)*20,(Math.random()-0.5)*20);
    scene.add(star);
    stars.push(star);
  }

  animate();
}

function animate(){
  requestAnimationFrame(animate);
  if(playing && analyser){
    let data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    let avg = data.reduce((a,b)=>a+b)/data.length;
    tunnel.rotation.x += avg/100000;
    tunnel.rotation.y += avg/100000;
    stars.forEach(s=>s.material.color.setHSL(Math.random(),1,0.5));
  }
  renderer.render(scene,camera);
}

function playBuffer(buffer){
  source = audioCtx.createBufferSource();
  source.buffer = buffer;
  analyser = audioCtx.createAnalyser();
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  source.start();
  playing = true;
  document.getElementById("overlay").style.display="none";
}

function loadAudio(file){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  let reader = new FileReader();
  reader.onload = function(e){
    audioCtx.decodeAudioData(e.target.result,function(buffer){
      playBuffer(buffer);
    });
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("fileInput").addEventListener("change",e=>{
  if(e.target.files.length>0) loadAudio(e.target.files[0]);
});

document.getElementById("demoBtn").addEventListener("click",()=>{
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  fetch("https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c7f1f.mp3?filename=demo.mp3")
    .then(r=>r.arrayBuffer())
    .then(buf=>{
      audioCtx.decodeAudioData(buf,function(buffer){
        playBuffer(buffer);
      });
    });
});

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

initScene();
</script>
</body>
</html>
