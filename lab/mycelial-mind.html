<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mycelial Mind • Velvet</title>

<style>
  html, body {
    margin: 0;
    background: #050507;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    color: #9fffd6;
  }

  canvas { display:block; }

  .panel {
    position: fixed;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 12px;
  }

  button {
    background:#10a37f;
    border:none;
    color:black;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    margin-top:6px;
  }

  .hidden { opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div class="panel" id="ui">
  <b>🌿 Mycelial Mind</b><br/>
  tap = energía<br/>
  doble tap = nueva neurona<br/>
  <button onclick="toggleUI()">ocultar</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H;
function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

function toggleUI(){
  document.getElementById("ui").classList.toggle("hidden");
}

class Node {
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.energy=Math.random();
    this.links=[];
    this.pulse=0;
  }
}

const nodes=[];
const MAX_DIST=120;

function addNode(x,y){
  const n = new Node(x,y);

  for(const other of nodes){
    const dx=other.x-x;
    const dy=other.y-y;
    const d=Math.hypot(dx,dy);

    if(d<MAX_DIST){
      n.links.push(other);
      other.links.push(n);
    }
  }

  nodes.push(n);
}

for(let i=0;i<60;i++){
  addNode(Math.random()*W, Math.random()*H);
}

let lastTap=0;

canvas.addEventListener("pointerdown", e=>{
  const now=performance.now();

  if(now-lastTap<250){
    addNode(e.clientX,e.clientY);
  }else{
    for(const n of nodes){
      const dx=n.x-e.clientX;
      const dy=n.y-e.clientY;
      if(Math.hypot(dx,dy)<150){
        n.energy+=1.5;
        n.pulse=1;
      }
    }
  }

  lastTap=now;
});

function update(){

  for(const n of nodes){

    n.energy*=0.995;

    if(n.energy>0.6){
      for(const l of n.links){
        l.energy+=0.02;
        l.pulse=1;
      }
    }

    n.pulse*=0.9;

    let fx=0, fy=0;

    for(const l of n.links){
      const dx=l.x-n.x;
      const dy=l.y-n.y;
      const d=Math.hypot(dx,dy)||1;

      const desired=50;
      const f=(d-desired)*0.0008;

      fx+=dx*f;
      fy+=dy*f;
    }

    n.x+=fx;
    n.y+=fy;
  }
}

function draw(){

  ctx.fillStyle="#050507";
  ctx.fillRect(0,0,W,H);

  ctx.lineWidth=1;

  for(const n of nodes){
    for(const l of n.links){

      const glow = Math.max(n.pulse,l.pulse);

      ctx.strokeStyle=`rgba(16,163,127,${0.1+glow*0.9})`;

      ctx.beginPath();
      ctx.moveTo(n.x,n.y);
      ctx.lineTo(l.x,l.y);
      ctx.stroke();
    }
  }

  for(const n of nodes){

    const r=2+n.energy*4;

    ctx.beginPath();
    ctx.arc(n.x,n.y,r,0,Math.PI*2);

    ctx.fillStyle=`rgba(160,255,220,${0.5+n.pulse})`;
    ctx.fill();
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
