<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LABORATORIO | BRUJO</title>
    <style>
        :root {
            --accent: #50d2d2;
            --bg: #000;
            --sidebar-w: 280px;
        }

        /* Reset total para evitar scroll fantasma */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            position: fixed; /* Evita que el body se mueva */
        }

        /* --- VIEWPORT: Ocupa toda la pantalla real --- */
        #viewport {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh; /* Se ajustará por JS para móviles */
            background: #000;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- BOTÓN MENÚ: Ahora en medio-derecha --- */
        #menu-toggle {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            background: var(--accent);
            color: #000;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-w);
            height: 100%;
            background: rgba(10, 10, 21, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(80, 210, 210, 0.2);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 999;
            padding: 20px;
            display: flex; flex-direction: column;
        }

        #sidebar.open { transform: translateX(0); }

        h2 { font-family: monospace; font-size: 1rem; color: var(--accent); text-align: center; letter-spacing: 5px; margin-bottom: 20px; }

        #lista-experimentos { flex-grow: 1; overflow-y: auto; padding-right: 10px; }

        .btn-exp {
            display: block; width: 100%; padding: 15px;
            margin-bottom: 10px; background: rgba(80, 210, 210, 0.1);
            border: 1px solid rgba(80, 210, 210, 0.2); color: #fff;
            border-radius: 8px; text-align: left; font-size: 0.7rem;
            text-transform: uppercase; cursor: pointer;
        }
        
        .btn-exp:active { background: var(--accent); color: #000; }

    </style>
</head>
<body>

    <button id="menu-toggle" onclick="toggleMenu()">☰</button>

    <div id="sidebar">
        <h2>CENTRAL</h2>
        <div id="lista-experimentos"></div>
    </div>

    <div id="viewport">
        <iframe id="visor" name="visor" src="about:blank"></iframe>
    </div>

    <script>
        // Función para ajustar la altura real en móviles (ignora barras de navegación)
        function adjustHeight() {
            const vh = window.innerHeight;
            document.getElementById('viewport').style.height = vh + 'px';
        }

        window.addEventListener('resize', adjustHeight);
        window.addEventListener('orientationchange', adjustHeight);

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function cargarExperimentos() {
            const lista = document.getElementById('lista-experimentos');
            const visor = document.getElementById('visor');
            try {
                const response = await fetch('experimentos.json');
                const data = await response.json();
                lista.innerHTML = "";
                data.proyectos.forEach((proy, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-exp';
                    btn.innerText = proy.nombre;
                    btn.onclick = () => {
                        visor.src = proy.archivo;
                        toggleMenu();
                    };
                    lista.appendChild(btn);
                    // Cargar el primero por defecto
                    if(index === 0) visor.src = proy.archivo;
                });
            } catch (e) {
                console.error("Error cargando JSON:", e);
            }
        }

        adjustHeight();
        cargarExperimentos();
    </script>
</body>
</html>
