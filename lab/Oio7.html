<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M87* - Gravitational Lensing</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #info h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,150,50,0.8);
        }
        canvas { 
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>M87* - GRAVITATIONAL LENSING</h1>
        <div>Curvatura del espacio-tiempo en acción</div>
        <div style="margin-top: 8px; opacity: 0.7;">Arrastra • Scroll • Espacio para reset</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 3, 12);
        camera.lookAt(0, 0, 0);

        const BH_RADIUS = 1.5;
        const PHOTON_SPHERE = 2.6;

        // ==================== CAMPO DE ESTRELLAS DENSO ====================
        const starfieldGeom = new THREE.SphereGeometry(50, 64, 64);
        
        const starfieldVertexShader = `
            varying vec3 vPosition;
            varying vec2 vUv;
            
            void main() {
                vPosition = position;
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        const starfieldFragmentShader = `
            uniform float time;
            uniform vec3 blackHolePos;
            varying vec3 vPosition;
            varying vec2 vUv;
            
            // Hash para generar estrellas
            float hash(vec3 p) {
                p = fract(p * vec3(443.537, 537.247, 247.428));
                p += dot(p, p.yxz + 19.19);
                return fract((p.x + p.y) * p.z);
            }
            
            // Noise 3D
            float noise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                
                return mix(
                    mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
                    f.z
                );
            }
            
            // LENSING GRAVITACIONAL
            vec3 applyGravitationalLensing(vec3 pos, vec3 bhPos, float bhMass) {
                vec3 toBlackHole = pos - bhPos;
                float dist = length(toBlackHole);
                
                // Radio de Schwarzschild normalizado
                float rs = bhMass;
                
                // Deflección gravitacional (ecuación de Einstein simplificada)
                if (dist > rs * 0.8) {
                    float deflection = (4.0 * rs) / dist;
                    deflection = min(deflection, 2.0); // Limitar deflección extrema
                    
                    // Dirección perpendicular
                    vec3 perpendicular = normalize(cross(toBlackHole, vec3(0, 1, 0)));
                    if (length(perpendicular) < 0.01) {
                        perpendicular = normalize(cross(toBlackHole, vec3(1, 0, 0)));
                    }
                    
                    // Aplicar curvatura
                    pos += perpendicular * deflection * 0.3;
                    
                    // Distorsión radial (efecto de lente)
                    float lensStrength = rs / (dist * dist);
                    vec3 radialDir = normalize(toBlackHole);
                    pos += radialDir * lensStrength * 2.0;
                }
                
                return pos;
            }
            
            void main() {
                // Aplicar lensing a la posición
                vec3 lensedPos = applyGravitationalLensing(vPosition, blackHolePos, 1.5);
                
                // Generar estrellas con el hash
                float starDensity = 80.0;
                vec3 starCoord = lensedPos * starDensity;
                float star = hash(floor(starCoord));
                
                // Umbral para estrellas visibles
                if (star > 0.998) {
                    // Brillo de la estrella
                    vec3 localPos = fract(starCoord);
                    float brightness = 1.0 - length(localPos - 0.5) * 4.0;
                    brightness = max(0.0, brightness);
                    brightness = pow(brightness, 3.0);
                    
                    // Color de la estrella (temperatura)
                    vec3 starColor;
                    float temp = hash(floor(starCoord) + vec3(100.0));
                    if (temp > 0.7) {
                        starColor = vec3(0.7, 0.8, 1.0); // Azul (caliente)
                    } else if (temp > 0.4) {
                        starColor = vec3(1.0, 1.0, 1.0); // Blanco
                    } else {
                        starColor = vec3(1.0, 0.8, 0.6); // Naranja (fría)
                    }
                    
                    // Distancia al agujero negro para fade
                    float distToCenter = length(vPosition - blackHolePos);
                    float fade = smoothstep(1.0, 3.0, distToCenter);
                    
                    gl_FragColor = vec4(starColor * brightness * fade, brightness * fade);
                } else {
                    // Nebulosa sutil de fondo
                    float nebula = noise3D(lensedPos * 2.0 + time * 0.1) * 0.02;
                    gl_FragColor = vec4(vec3(0.1, 0.05, 0.15) * nebula, nebula);
                }
            }
        `;
        
        const starfieldMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                blackHolePos: { value: new THREE.Vector3(0, 0, 0) }
            },
            vertexShader: starfieldVertexShader,
            fragmentShader: starfieldFragmentShader,
            side: THREE.BackSide,
            transparent: true,
            depthWrite: false
        });
        
        const starfield = new THREE.Mesh(starfieldGeom, starfieldMaterial);
        scene.add(starfield);

        // ==================== DISCO DE ACRECIÓN ====================
        const diskVertexShader = `
            varying vec3 vPosition;
            varying float vDistance;
            
            void main() {
                vPosition = position;
                vDistance = length(position);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const diskFragmentShader = `
            uniform float time;
            varying vec3 vPosition;
            varying float vDistance;
            
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }
            
            void main() {
                float dist = length(vPosition.xz);
                float angle = atan(vPosition.z, vPosition.x);
                
                float ringDist = abs(dist - 2.6);
                float ringIntensity = exp(-ringDist * ringDist * 2.5);
                
                float doppler = 1.3 + 0.9 * sin(angle + time * 0.5);
                
                float noise = random(vec2(angle * 10.0, dist * 5.0 + time));
                float turbulence = noise * 0.3;
                
                float intensity = (0.3 + ringIntensity) * doppler * (0.7 + turbulence);
                intensity = clamp(intensity, 0.0, 1.0);
                
                vec3 color;
                if (intensity < 0.3) {
                    color = vec3(intensity * 3.0, intensity * 0.5, 0.0);
                } else if (intensity < 0.6) {
                    float t = (intensity - 0.3) / 0.3;
                    color = mix(vec3(0.9, 0.15, 0.0), vec3(1.0, 0.7, 0.1), t);
                } else {
                    float t = (intensity - 0.6) / 0.4;
                    color = mix(vec3(1.0, 0.7, 0.1), vec3(1.0, 1.0, 0.9), t);
                }
                
                float edgeFade = 1.0;
                if (dist > 7.0) {
                    edgeFade = 1.0 - (dist - 7.0);
                }
                if (dist < 3.8) {
                    edgeFade = (dist - 3.5) / 0.3;
                }
                
                gl_FragColor = vec4(color * intensity * edgeFade, intensity * edgeFade * 0.9);
            }
        `;

        const diskGeometry = new THREE.RingGeometry(3.5, 8, 128, 64);
        const diskMaterial = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: diskVertexShader,
            fragmentShader: diskFragmentShader,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        
        const disk = new THREE.Mesh(diskGeometry, diskMaterial);
        disk.rotation.x = -Math.PI / 2 + 0.3;
        scene.add(disk);

        // ==================== ANILLO DE FOTONES ====================
        const photonCount = 3000;
        const photonPos = new Float32Array(photonCount * 3);
        const photonColors = new Float32Array(photonCount * 3);

        for (let i = 0; i < photonCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = PHOTON_SPHERE + (Math.random() - 0.5) * 0.4;
            const y = (Math.random() - 0.5) * 0.3;
            
            photonPos[i * 3] = Math.cos(angle) * radius;
            photonPos[i * 3 + 1] = y;
            photonPos[i * 3 + 2] = Math.sin(angle) * radius;
            
            const intensity = 0.7 + Math.random() * 0.3;
            photonColors[i * 3] = 1.0;
            photonColors[i * 3 + 1] = 0.8 * intensity;
            photonColors[i * 3 + 2] = 0.3 * intensity;
        }

        const photonGeom = new THREE.BufferGeometry();
        photonGeom.setAttribute('position', new THREE.BufferAttribute(photonPos, 3));
        photonGeom.setAttribute('color', new THREE.BufferAttribute(photonColors, 3));

        const photonMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });

        const photonRing = new THREE.Points(photonGeom, photonMat);
        photonRing.rotation.x = 0.3; // Alinear con el disco
        scene.add(photonRing);

        // ==================== HORIZONTE ====================
        const horizonGeom = new THREE.CircleGeometry(BH_RADIUS, 64);
        const horizonMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000,
            side: THREE.DoubleSide
        });
        const horizon = new THREE.Mesh(horizonGeom, horizonMat);
        horizon.rotation.x = -Math.PI / 2 + 0.3;
        scene.add(horizon);

        const glowGeom = new THREE.RingGeometry(BH_RADIUS, BH_RADIUS + 0.15, 64);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xff6600,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const horizonGlow = new THREE.Mesh(glowGeom, glowMat);
        horizonGlow.rotation.x = -Math.PI / 2 + 0.3;
        scene.add(horizonGlow);

        // ==================== CONTROLES ====================
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };

        const getPointerPos = (e) => {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        };

        const onPointerDown = (e) => {
            isDragging = true;
            prevMouse = getPointerPos(e);
            e.preventDefault();
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            const curr = getPointerPos(e);
            rotation.y += (curr.x - prevMouse.x) * 0.005;
            rotation.x += (curr.y - prevMouse.y) * 0.005;
            rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));
            prevMouse = curr;
            e.preventDefault();
        };

        const onPointerUp = (e) => {
            isDragging = false;
            e.preventDefault();
        };

        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        renderer.domElement.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('mouseleave', onPointerUp);
        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });
        renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: false });
        renderer.domElement.addEventListener('touchend', onPointerUp, { passive: false });

        let targetZoom = 12;
        let currentZoom = 12;

        renderer.domElement.addEventListener('wheel', (e) => {
            targetZoom += e.deltaY * 0.01;
            targetZoom = Math.max(8, Math.min(20, targetZoom));
            e.preventDefault();
        }, { passive: false });

        let lastTouchDist = 0;
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (lastTouchDist > 0) {
                    targetZoom -= (dist - lastTouchDist) * 0.02;
                    targetZoom = Math.max(8, Math.min(20, targetZoom));
                }
                lastTouchDist = dist;
                e.preventDefault();
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) lastTouchDist = 0;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                rotation = { x: 0, y: 0 };
                targetZoom = 12;
                e.preventDefault();
            }
        });

        // ==================== ANIMACIÓN ====================
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            diskMaterial.uniforms.time.value = time;
            starfieldMaterial.uniforms.time.value = time;
            
            // Actualizar posición del agujero negro en el shader del starfield
            starfieldMaterial.uniforms.blackHolePos.value.set(0, 0, 0);

            photonRing.rotation.y += 0.003;

            currentZoom += (targetZoom - currentZoom) * 0.1;

            const dist = currentZoom;
            camera.position.x = Math.sin(rotation.y) * Math.cos(rotation.x) * dist;
            camera.position.y = 3 + Math.sin(rotation.x) * dist * 0.3;
            camera.position.z = Math.cos(rotation.y) * Math.cos(rotation.x) * dist;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
