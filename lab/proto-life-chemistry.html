<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Proto-Life Chemistry</title>
<style>
  html,body{
    margin:0;
    background:#000;
    overflow:hidden;
    touch-action:none;
    font-family:system-ui;
  }

  canvas{display:block}

  #ui{
    position:fixed;
    top:10px;
    left:10px;
    background:#000c;
    backdrop-filter: blur(6px);
    padding:10px 14px;
    border-radius:14px;
    color:#10a37f;
    font-size:13px;
  }

  button{
    background:#10a37f22;
    border:1px solid #10a37f55;
    color:#10a37f;
    border-radius:8px;
    padding:4px 8px;
    margin-right:4px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  🧬 atoms: <span id="count">0</span><br/>
  <button onclick="spawn(50)">+50</button>
  <button onclick="spawn(200)">+200</button>
  <button onclick="reset()">reset</button>
</div>

<script>
const canvas = document.getElementById("c")
const ctx = canvas.getContext("2d")
const countEl = document.getElementById("count")

function resize(){
  canvas.width = innerWidth
  canvas.height = innerHeight
}
resize()
addEventListener("resize", resize)


// -------------------------------
// config
// -------------------------------

const CELL = 40      // grid size
const BOND_DIST = 18
const MAX_SPEED = 1.5

let atoms = []
let grid = {}


// -------------------------------
// atom class
// -------------------------------

class Atom{
  constructor(x,y){
    this.x=x
    this.y=y
    this.vx=(Math.random()-0.5)
    this.vy=(Math.random()-0.5)
    this.bonds=[]
  }

  update(){
    this.x+=this.vx
    this.y+=this.vy

    this.vx*=0.99
    this.vy*=0.99

    // bounds
    if(this.x<0||this.x>canvas.width) this.vx*=-1
    if(this.y<0||this.y>canvas.height) this.vy*=-1

    // speed clamp
    const s=Math.hypot(this.vx,this.vy)
    if(s>MAX_SPEED){
      this.vx*=MAX_SPEED/s
      this.vy*=MAX_SPEED/s
    }
  }

  draw(){
    ctx.fillStyle="#10a37f"
    ctx.beginPath()
    ctx.arc(this.x,this.y,3,0,Math.PI*2)
    ctx.fill()

    // bonds
    ctx.strokeStyle="#10a37f33"
    for(const b of this.bonds){
      ctx.beginPath()
      ctx.moveTo(this.x,this.y)
      ctx.lineTo(b.x,b.y)
      ctx.stroke()
    }
  }
}


// -------------------------------
// grid helpers (O(1) neighborhood)
// -------------------------------

function buildGrid(){
  grid={}
  for(const a of atoms){
    const gx=(a.x/CELL)|0
    const gy=(a.y/CELL)|0
    const k=gx+","+gy
    if(!grid[k]) grid[k]=[]
    grid[k].push(a)
  }
}

function neighbors(a){
  const gx=(a.x/CELL)|0
  const gy=(a.y/CELL)|0
  let list=[]

  for(let x=-1;x<=1;x++)
    for(let y=-1;y<=1;y++){
      const k=(gx+x)+","+(gy+y)
      if(grid[k]) list.push(...grid[k])
    }

  return list
}


// -------------------------------
// bonding physics
// -------------------------------

function tryBond(a,b){
  if(a.bonds.includes(b)) return

  const dx=b.x-a.x
  const dy=b.y-a.y
  const d=Math.hypot(dx,dy)

  if(d<BOND_DIST && a.bonds.length<3 && b.bonds.length<3){
    a.bonds.push(b)
    b.bonds.push(a)
  }
}


// -------------------------------
// simulation
// -------------------------------

function step(){
  ctx.fillStyle="#00000022"
  ctx.fillRect(0,0,canvas.width,canvas.height)

  buildGrid()

  // bond phase
  for(const a of atoms){
    for(const b of neighbors(a)){
      if(a!==b) tryBond(a,b)
    }
  }

  // update + draw
  for(const a of atoms){
    a.update()
    a.draw()
  }

  countEl.textContent = atoms.length

  requestAnimationFrame(step)
}


// -------------------------------
// spawn / controls
// -------------------------------

function spawn(n){
  for(let i=0;i<n;i++){
    atoms.push(new Atom(
      Math.random()*canvas.width,
      Math.random()*canvas.height
    ))
  }
}

function reset(){
  atoms=[]
}


// touch spawn
canvas.addEventListener("pointerdown", e=>{
  for(let i=0;i<20;i++){
    atoms.push(new Atom(e.clientX,e.clientY))
  }
})


// start
spawn(120)
step()
</script>
</body>
</html>
