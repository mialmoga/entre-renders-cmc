<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LABORATORIO | BRUJO EDITION</title>
    <style>
        :root {
            --accent: #50d2d2;
            --bg: #05050a;
            --panel: #0a0a15;
            --sidebar-w: 280px;
            --glitch-color: #ff00c1;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; display: flex; height: 100vh; 
            background: var(--bg); color: var(--accent); 
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
        }

        /* --- BOTÓN GLITCH --- */
        #menu-toggle {
            display: none; position: fixed; top: 15px; left: 15px;
            z-index: 100; background: var(--accent); color: #000;
            border: none; padding: 12px 20px; font-weight: bold;
            letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 0 15px var(--accent);
        }

        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            #menu-toggle::before, #menu-toggle::after {
                content: '☰ MENU'; position: absolute; top: 0; left: 0; 
                width: 100%; height: 100%; background: var(--accent);
                display: flex; align-items: center; justify-content: center; opacity: 0.8;
            }
            #menu-toggle::before {
                left: 3px; text-shadow: -2px 0 var(--glitch-color);
                clip: rect(44px, 450px, 56px, 0);
                animation: glitch-anim 5s infinite linear alternate-reverse;
            }
            #menu-toggle::after {
                left: -3px; text-shadow: -2px 0 #00fff9, 2px 2px var(--glitch-color);
                animation: glitch-anim2 1s infinite linear alternate-reverse;
            }
        }

        /* --- BARRA LATERAL --- */
        #sidebar { 
            width: var(--sidebar-w); background: var(--panel); 
            border-right: 1px solid rgba(80, 210, 210, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            flex-shrink: 0; z-index: 90;
        }

        h2 { 
            font-size: 1.1rem; letter-spacing: 3px; text-align: center;
            margin: 20px 0; text-shadow: 0 0 10px var(--accent);
        }

        #lista-experimentos { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

        .btn-exp {
            display: block; width: 100%; min-height: 50px; padding: 10px;
            margin-bottom: 12px; background: rgba(80, 210, 210, 0.05);
            border: 1px solid rgba(80, 210, 210, 0.2); color: #888;
            text-align: left; border-radius: 4px; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; font-size: 0.75rem;
        }

        .btn-exp:hover, .btn-exp:active {
            background: var(--accent); color: #000;
            box-shadow: 0 0 20px var(--accent);
            transform: translateX(5px);
            animation: shake 0.2s infinite;
        }

        /* --- VIEWPORT --- */
        #viewport { flex-grow: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #viewport { width: 100vw; }
        }

        /* --- ANIMACIONES --- */
        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            20% { clip: rect(2px, 9999px, 23px, 0); }
            60% { clip: rect(67px, 9999px, 62px, 0); }
            100% { clip: rect(10px, 9999px, 80px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(0.3deg); }
            50% { clip: rect(40px, 9999px, 60px, 0); transform: skew(-1deg); }
            100% { clip: rect(80px, 9999px, 10px, 0); transform: skew(0.1deg); }
        }
        @keyframes shake {
            0% { transform: translate(0,0) }
            50% { transform: translate(2px, -1px) }
            100% { transform: translate(-1px, 1px) }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); }
    </style>
</head>
<body>

    <button id="menu-toggle" onclick="toggleMenu()">☰ MENU</button>

    <div id="sidebar">
        <h2>LABORATORIO</h2>
        <div id="lista-experimentos">
            </div>
    </div>

    <div id="viewport">
        <iframe id="visor" name="visor"></iframe>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function cargarExperimentos() {
            const lista = document.getElementById('lista-experimentos');
            const visor = document.getElementById('visor');

            try {
                const response = await fetch('experimentos.json');
                const data = await response.json();
                lista.innerHTML = ""; // Limpiar mensaje de carga

                data.proyectos.forEach(proy => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-exp';
                    btn.innerText = proy.nombre;
                    btn.onclick = () => {
                        visor.src = proy.archivo;
                        if (window.innerWidth <= 768) toggleMenu();
                    };
                    lista.appendChild(btn);
                });
            } catch (e) {
                lista.innerHTML = "<p style='color:red'>Grimorio no encontrado (JSON).</p>";
            }
        }

        window.onload = cargarExperimentos;
    </script>
</body>
</html>
