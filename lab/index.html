<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LABORATORIO | BRUJO</title>
    <style>
        :root {
            --accent: #50d2d2;
            --bg: #05050a;
            --panel: #0a0a15;
            --sidebar-w: 280px;
            --glitch-color: #ff00c1;
        }

        body { 
            margin: 0; display: flex; height: 100vh; 
            background: var(--bg); color: var(--accent); 
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
        }

        /* --- BOTÓN FLOTANTE DERECHA --- */
        #menu-toggle {
            display: none; /* Se activa en móvil */
            position: fixed; 
            right: 15px; /* Lado derecho */
            top: 50%; /* Centrado vertical */
            transform: translateY(-50%);
            z-index: 1000; 
            background: var(--accent); 
            color: #000;
            border: none; 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; /* Circular */
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(80, 210, 210, 0.5);
            display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 768px) {
            #menu-toggle { display: flex; }
            
            /* Efecto Glitch sutil solo en el icono */
            #menu-toggle::after {
                content: '☰'; position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                display: flex; align-items: center; justify-content: center;
                animation: glitch-icon 3s infinite linear;
                opacity: 0.5;
            }
        }

        /* --- BARRA LATERAL --- */
        #sidebar { 
            width: var(--sidebar-w); background: var(--panel); 
            border-right: 1px solid rgba(80, 210, 210, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            flex-shrink: 0; z-index: 999;
        }

        @media (max-width: 768px) {
            #sidebar { 
                position: fixed; left: 0; top: 0; height: 100%; 
                transform: translateX(-100%); 
            }
            #sidebar.open { transform: translateX(0); }
        }

        /* --- RESTO DEL ESTILO --- */
        h2 { font-size: 1.1rem; letter-spacing: 3px; text-align: center; margin: 20px 0; }
        #lista-experimentos { flex-grow: 1; overflow-y: auto; }
        .btn-exp {
            display: block; width: 100%; min-height: 50px; padding: 10px;
            margin-bottom: 12px; background: rgba(80, 210, 210, 0.05);
            border: 1px solid rgba(80, 210, 210, 0.2); color: #888;
            text-align: left; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; font-size: 0.75rem;
        }
        .btn-exp:active { background: var(--accent); color: #000; }

        #viewport { flex-grow: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        @keyframes glitch-icon {
            0% { transform: translate(0); text-shadow: 2px 0 red; }
            2% { transform: translate(-2px, 2px); text-shadow: -2px 0 blue; }
            4% { transform: translate(0); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <button id="menu-toggle" onclick="toggleMenu()">☰</button>

    <div id="sidebar">
        <h2>LABORATORIO</h2>
        <div id="lista-experimentos"></div>
    </div>

    <div id="viewport">
        <iframe id="visor" name="visor"></iframe>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function cargarExperimentos() {
            const lista = document.getElementById('lista-experimentos');
            const visor = document.getElementById('visor');
            try {
                const response = await fetch('experimentos.json');
                const data = await response.json();
                lista.innerHTML = "";
                data.proyectos.forEach(proy => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-exp';
                    btn.innerText = proy.nombre;
                    btn.onclick = () => {
                        visor.src = proy.archivo;
                        if (window.innerWidth <= 768) toggleMenu();
                    };
                    lista.appendChild(btn);
                });
            } catch (e) {
                lista.innerHTML = "<p>Error JSON</p>";
            }
        }
        window.onload = cargarExperimentos;
    </script>
</body>
</html>
