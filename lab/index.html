<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LABORATORIO | BRUJO</title>
    <style>
        :root {
            --accent: #50d2d2;
            --bg: #05050a;
            --panel: #0a0a15;
            --sidebar-w: 280px;
        }

        /* Usamos 100svh para asegurar que quepa exactamente en el espacio visible */
        body { 
            margin: 0; display: flex; height: 100svh; width: 100vw;
            background: var(--bg); color: var(--accent); 
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
        }

        /* --- BOTÓN FLOTANTE DERECHA --- */
        #menu-toggle {
            position: fixed; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%);
            z-index: 1000; 
            background: rgba(80, 210, 210, 0.8); 
            color: #000;
            border: none; 
            width: 45px; 
            height: 45px; 
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- BARRA LATERAL --- */
        #sidebar { 
            width: var(--sidebar-w); background: var(--panel); 
            border-right: 1px solid rgba(80, 210, 210, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            flex-shrink: 0; z-index: 999;
        }

        @media (max-width: 768px) {
            #sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }

        /* --- VIEWPORT DEL IFRAME --- */
        #viewport { 
            flex-grow: 1; 
            background: #000; 
            position: relative;
            height: 100%;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }

        /* Estilo de botones de experimento */
        .btn-exp {
            display: block; width: 100%; padding: 12px;
            margin-bottom: 10px; background: rgba(80, 210, 210, 0.05);
            border: 1px solid rgba(80, 210, 210, 0.1); color: #ccc;
            text-align: left; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; letter-spacing: 1px;
        }
        .btn-exp:hover { border-color: var(--accent); color: var(--accent); }

        h2 { font-size: 0.9rem; letter-spacing: 4px; text-align: center; margin-bottom: 30px; opacity: 0.7; }
    </style>
</head>
<body onclick="requestFullScreen()">

    <button id="menu-toggle" onclick="toggleMenu(event)">☰</button>

    <div id="sidebar">
        <h2>CENTRAL DE DATOS</h2>
        <div id="lista-experimentos"></div>
    </div>

    <div id="viewport">
        <iframe id="visor" name="visor"></iframe>
    </div>

    <script>
        // Función para forzar pantalla completa al primer toque
        function requestFullScreen() {
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;

            if(!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl);
            }
        }

        function toggleMenu(e) {
            if(e) e.stopPropagation(); // Evita conflictos con el fullscreen
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function cargarExperimentos() {
            const lista = document.getElementById('lista-experimentos');
            const visor = document.getElementById('visor');
            try {
                const response = await fetch('experimentos.json');
                const data = await response.json();
                lista.innerHTML = "";
                data.proyectos.forEach(proy => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-exp';
                    btn.innerText = proy.nombre;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        visor.src = proy.archivo;
                        if (window.innerWidth <= 768) toggleMenu();
                    };
                    lista.appendChild(btn);
                });
            } catch (e) {
                lista.innerHTML = "<p>Error al cargar JSON</p>";
            }
        }

        window.onload = cargarExperimentos;
    </script>
</body>
</html>
