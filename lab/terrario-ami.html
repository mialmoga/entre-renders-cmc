<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Terrario AMI · Velvet</title>

<style>
html, body {
  margin:0;
  overflow:hidden;
  background:#050505;
  font-family: system-ui, sans-serif;
  touch-action:none;
}

canvas { display:block; }

.panel {
  position:fixed;
  top:12px;
  left:12px;
  background:rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
  color:#10a37f;
  padding:10px 14px;
  border-radius:10px;
  font-size:13px;
}

.btn {
  position:fixed;
  top:12px;
  right:12px;
  background:#10a37f;
  color:black;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  font-weight:bold;
}

.hidden { opacity:0; pointer-events:none; transition:.25s; }
</style>
</head>

<body>

<div id="ui" class="panel">
🌱 AMIs: <span id="a">0</span><br>
🍎 comida: <span id="f">0</span>
</div>

<button id="toggle" class="btn">☰</button>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(
  innerWidth/-2, innerWidth/2,
  innerHeight/2, innerHeight/-2,
  0.1, 1000
);
camera.position.z = 10;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.left = innerWidth/-2;
  camera.right = innerWidth/2;
  camera.top = innerHeight/2;
  camera.bottom = innerHeight/-2;
  camera.updateProjectionMatrix();
});

/* ========= ENTIDADES ========= */

const amis = [];
const foods = [];

const amiGeo = new THREE.CircleGeometry(4, 16);
const foodGeo = new THREE.CircleGeometry(2, 12);

function spawnFood(x,y){
  const m = new THREE.MeshBasicMaterial({ color:0xffc857 });
  const mesh = new THREE.Mesh(foodGeo, m);
  mesh.position.set(x,y,0);
  mesh.energy = 20;

  foods.push(mesh);
  scene.add(mesh);
}

function spawnAmi(x,y){
  const m = new THREE.MeshBasicMaterial({ color:0x10a37f });
  const mesh = new THREE.Mesh(amiGeo, m);

  mesh.position.set(x,y,0);
  mesh.vel = new THREE.Vector2(
    (Math.random()-0.5)*2,
    (Math.random()-0.5)*2
  );
  mesh.energy = 40;

  amis.push(mesh);
  scene.add(mesh);
}

/* ========= INPUT ========= */

function worldPos(e){
  const r = renderer.domElement.getBoundingClientRect();
  return {
    x: (e.clientX-r.left)-innerWidth/2,
    y: -(e.clientY-r.top)+innerHeight/2
  }
}

renderer.domElement.addEventListener('pointerdown', e=>{
  const p = worldPos(e);
  spawnFood(p.x,p.y);
});

/* ========= LOOP ========= */

const uiA = document.getElementById('a');
const uiF = document.getElementById('f');

function step(){

  // comida random
  if(Math.random() < 0.02){
    spawnFood(
      (Math.random()-0.5)*innerWidth,
      (Math.random()-0.5)*innerHeight
    );
  }

  for(let ami of amis){

    ami.energy -= 0.05;

    // buscar comida más cercana
    let closest = null;
    let minD = 99999;

    for(let f of foods){
      const d = ami.position.distanceTo(f.position);
      if(d < minD){
        minD = d;
        closest = f;
      }
    }

    if(closest){
      const dir = new THREE.Vector2(
        closest.position.x - ami.position.x,
        closest.position.y - ami.position.y
      ).normalize();

      ami.vel.add(dir.multiplyScalar(0.15));
    }

    ami.vel.multiplyScalar(0.97);
    ami.position.x += ami.vel.x;
    ami.position.y += ami.vel.y;

    // comer
    for(let i=foods.length-1;i>=0;i--){
      const f = foods[i];
      if(ami.position.distanceTo(f.position) < 6){
        ami.energy += f.energy;
        scene.remove(f);
        foods.splice(i,1);
      }
    }

    // reproducirse
    if(ami.energy > 80){
      ami.energy *= 0.5;
      spawnAmi(
        ami.position.x + (Math.random()-0.5)*20,
        ami.position.y + (Math.random()-0.5)*20
      );
    }
  }

  // muerte
  for(let i=amis.length-1;i>=0;i--){
    if(amis[i].energy <= 0){
      scene.remove(amis[i]);
      amis.splice(i,1);
    }
  }

  uiA.textContent = amis.length;
  uiF.textContent = foods.length;

  renderer.render(scene,camera);
  requestAnimationFrame(step);
}

/* ========= UI ========= */

document.getElementById('toggle').onclick=()=>{
  document.getElementById('ui').classList.toggle('hidden');
};

/* ========= START ========= */

for(let i=0;i<8;i++){
  spawnAmi(
    (Math.random()-0.5)*300,
    (Math.random()-0.5)*300
  );
}

step();

</script>
</body>
</html>
