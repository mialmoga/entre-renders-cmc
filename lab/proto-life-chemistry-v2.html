<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
html,body{margin:0;background:#05070a;overflow:hidden}
canvas{display:block}
.ui{
 position:fixed;top:10px;left:10px;
 background:rgba(0,0,0,.45);
 padding:8px;border-radius:10px;
 color:#9fffe0;font:12px monospace
}
button{margin:2px;background:#10a37f;border:none;border-radius:8px;padding:5px}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="ui">
H<button onclick="spawn('H',40)">+</button>
C<button onclick="spawn('C',25)">+</button>
O<button onclick="spawn('O',25)">+</button>
🔥<button onclick="temp*=1.6">+</button>
❄️<button onclick="temp*=0.6">-</button>
<span id="s"></span>
</div>

<script>
const c=document.getElementById("c");
const x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let temp=1;

const T={
 H:{r:2,c:"#9cf"},
 C:{r:3,c:"#aaa"},
 O:{r:3,c:"#f66"},
 W:{r:4,c:"#4cf"}, // agua
 M:{r:4,c:"#8f8"}, // metano
 P:{r:3,c:"#ddd"}  // polímero
};

let a=[];

function spawn(t,n){
 for(let i=0;i<n;i++)
  a.push({
   t,
   x:Math.random()*c.width,
   y:Math.random()*c.height,
   vx:(Math.random()-.5)*2,
   vy:(Math.random()-.5)*2
  });
}

spawn("H",120);
spawn("C",60);
spawn("O",60);

function d2(A,B){
 let dx=A.x-B.x,dy=A.y-B.y;
 return dx*dx+dy*dy;
}

function react(i,j){
 let A=a[i],B=a[j];

 if((A.t==="H"&&B.t==="O")||(A.t==="O"&&B.t==="H")){
  if(Math.random()<0.02/temp){A.t="W";B.t="W";}
 }

 if((A.t==="C"&&B.t==="H")||(A.t==="H"&&B.t==="C")){
  if(Math.random()<0.015/temp){A.t="M";B.t="M";}
 }

 if(A.t==="C"&&B.t==="C"){
  if(Math.random()<0.01/temp){A.t="P";B.t="P";}
 }

 if(temp>1.8 && Math.random()<0.02){
  if(A.t!=="H") A.t="H";
 }
}

function loop(){

 x.fillStyle="rgba(5,7,10,.3)";
 x.fillRect(0,0,c.width,c.height);

 for(let i=0;i<a.length;i++){
  let A=a[i];

  A.vx+=(Math.random()-.5)*.2*temp;
  A.vy+=(Math.random()-.5)*.2*temp;

  A.x+=A.vx;A.y+=A.vy;

  if(A.x<0||A.x>c.width)A.vx*=-1;
  if(A.y<0||A.y>c.height)A.vy*=-1;

  for(let j=i+1;j<a.length;j++){
   if(d2(A,a[j])<20) react(i,j);
  }

  let t=T[A.t];
  x.fillStyle=t.c;
  x.beginPath();
  x.arc(A.x,A.y,t.r,0,7);
  x.fill();
 }

 document.getElementById("s").innerText=" temp:"+temp.toFixed(2);

 temp*=0.999;

 requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
