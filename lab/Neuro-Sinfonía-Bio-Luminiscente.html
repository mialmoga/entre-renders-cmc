<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neuro-Sinfonía • Éter</title>
    <style>
        :root {
            --neon: #00ffcc;
            --bg: #05080a;
            --panel-bg: rgba(10, 20, 25, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--neon);
            touch-action: none;
        }

        canvas {
            display: block;
            filter: contrast(1.2) brightness(1.1);
        }

        #ui-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        #ui-panel.minimized {
            transform: translateX(-50%) translateY(80%);
            opacity: 0.5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .controls {
            display: grid;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.7rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        input[type=range] {
            appearance: none;
            background: rgba(0, 255, 204, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 15px;
            height: 15px;
            background: var(--neon);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon);
        }

        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 0.6rem;
            text-align: right;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="stats">
        NEXOS: <span id="node-count">0</span><br>
        ESTADO: ESTABLE
    </div>

    <div id="ui-panel">
        <div class="header" onclick="toggleUI()">
            <h1>Neuro-Sinfonía</h1>
            <span id="toggle-icon">▼</span>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>Viscosidad del Éter</label>
                <input type="range" id="drag" min="0.8" max="0.99" step="0.01" value="0.95">
            </div>
            <div class="control-group">
                <label>Tensión Sináptica</label>
                <input type="range" id="tension" min="0.0001" max="0.01" step="0.0001" value="0.002">
            </div>
            <div class="control-group">
                <label>Frecuencia de Brillo</label>
                <input type="range" id="glow" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const nodeCountDisplay = document.getElementById('node-count');
        
        // Settings
        let settings = {
            drag: 0.95,
            tension: 0.002,
            glow: 0.5,
            maxDist: 150
        };

        let nodes = [];
        let mouse = { x: -1000, y: -1000, active: false };

        function init() {
            resize();
            for(let i=0; i<40; i++) {
                nodes.push(new Node(Math.random()*canvas.width, Math.random()*canvas.height));
            }
            animate();
        }

        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.energy = Math.random();
                this.pulse = 0;
                this.radius = 2 + Math.random() * 3;
            }

            update() {
                // Comportamiento de "viento" u ondulación constante
                this.vx += Math.sin(Date.now() * 0.001 + this.x) * 0.01;
                this.vy += Math.cos(Date.now() * 0.001 + this.y) * 0.01;

                // Interacción con mouse/touch
                if(mouse.active) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if(dist < 200) {
                        const force = (200 - dist) * 0.0005;
                        this.vx += dx * force;
                        this.vy += dy * force;
                        this.energy = Math.min(1, this.energy + 0.02);
                    }
                }

                // Aplicar física
                this.vx *= settings.drag;
                this.vy *= settings.drag;
                this.x += this.vx;
                this.y += this.vy;

                // Límites con rebote suave
                if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vy *= -1;

                this.energy *= 0.99; // Decaimiento
                this.pulse = Math.sin(Date.now() * 0.005 + this.energy * 10) * 0.5 + 0.5;
            }
        }

        function draw() {
            // Efecto de rastro (Trails)
            ctx.fillStyle = 'rgba(5, 8, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 0.5;

            for(let i=0; i<nodes.length; i++) {
                const a = nodes[i];
                a.update();

                for(let j=i+1; j<nodes.length; j++) {
                    const b = nodes[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.hypot(dx, dy);

                    if(dist < settings.maxDist) {
                        // Tensión elástica (reorganización)
                        const f = (dist - settings.maxDist * 0.5) * settings.tension;
                        a.vx += dx * f;
                        a.vy += dy * f;
                        b.vx -= dx * f;
                        b.vy -= dy * f;

                        // Dibujar conexión con gradiente de energía
                        const alpha = (1 - dist/settings.maxDist) * (a.energy + b.energy) * 0.5;
                        ctx.strokeStyle = `rgba(0, 255, 204, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }

                // Dibujar el nodo
                const r = a.radius + (a.pulse * 2 * settings.glow);
                const glowAlpha = (a.energy * 0.5 + a.pulse * 0.5) * settings.glow;
                
                // Glow
                const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, r * 4);
                grad.addColorStop(0, `rgba(0, 255, 204, ${glowAlpha})`);
                grad.addColorStop(1, 'transparent');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(a.x, a.y, r * 4, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `rgba(200, 255, 240, ${0.5 + a.energy * 0.5})`;
                ctx.beginPath();
                ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            nodeCountDisplay.innerText = nodes.length;
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Interacción
        window.addEventListener('resize', resize);
        
        const handleStart = (e) => {
            mouse.active = true;
            const t = e.touches ? e.touches[0] : e;
            mouse.x = t.clientX;
            mouse.y = t.clientY;
        };

        const handleMove = (e) => {
            const t = e.touches ? e.touches[0] : e;
            mouse.x = t.clientX;
            mouse.y = t.clientY;
        };

        const handleEnd = () => { mouse.active = false; };

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart);
        canvas.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        // Doble toque para crear nodos
        let lastTap = 0;
        canvas.addEventListener('pointerdown', (e) => {
            const now = Date.now();
            if(now - lastTap < 300) {
                nodes.push(new Node(e.clientX, e.clientY));
                if(nodes.length > 100) nodes.shift();
            }
            lastTap = now;
        });

        // UI Logic
        function toggleUI() {
            const panel = document.getElementById('ui-panel');
            const icon = document.getElementById('toggle-icon');
            panel.classList.toggle('minimized');
            icon.innerText = panel.classList.contains('minimized') ? '▲' : '▼';
        }

        // Bind Sliders
        document.getElementById('drag').addEventListener('input', (e) => settings.drag = parseFloat(e.target.value));
        document.getElementById('tension').addEventListener('input', (e) => settings.tension = parseFloat(e.target.value));
        document.getElementById('glow').addEventListener('input', (e) => settings.glow = parseFloat(e.target.value));

        init();
    </script>
</body>
  </html>
