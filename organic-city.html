<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Orgánica Generativa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #ffd89b 0%, #19547b 100%);
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(25, 84, 123, 0.85);
            padding: 18px;
            border-radius: 12px;
            font-size: 14px;
            max-width: 320px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        #info h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            color: #ffd89b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #info p {
            margin: 6px 0;
            line-height: 1.6;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(25, 84, 123, 0.85);
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            min-width: 180px;
        }
        .stat-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-value {
            font-weight: bold;
            color: #ffd89b;
            font-size: 16px;
        }
        button {
            background: rgba(255, 216, 155, 0.3);
            border: 2px solid #ffd89b;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px 0;
            width: 100%;
            font-size: 13px;
        }
        button:hover {
            background: rgba(255, 216, 155, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 216, 155, 0.4);
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🏙️ Ciudad Orgánica</h2>
        <p><strong>🖱️ Click:</strong> Plantar edificio</p>
        <p><strong>🌱 Espera:</strong> Los edificios crecen solos</p>
        <p><strong>🎲 Tecla SPACE:</strong> Generar distrito aleatorio</p>
        <p><strong>🔄 Arrastra:</strong> Rotar cámara</p>
        <button id="clearBtn">🗑️ Limpiar Ciudad</button>
        <button id="autoBtn">🤖 Auto-Construcción</button>
    </div>

    <div id="stats">
        <div class="stat-item">
            <span>🏢 Edificios:</span>
            <span class="stat-value" id="buildingCount">0</span>
        </div>
        <div class="stat-item">
            <span>👥 Población:</span>
            <span class="stat-value" id="population">0</span>
        </div>
        <div class="stat-item">
            <span>⚡ Energía:</span>
            <span class="stat-value" id="energy">100%</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x19547b, 10, 50);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(15, 15, 15);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff8dc, 0.8);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -20;
        sunLight.shadow.camera.right = 20;
        sunLight.shadow.camera.top = 20;
        sunLight.shadow.camera.bottom = -20;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // Suelo (base de la ciudad)
        const groundGeometry = new THREE.CircleGeometry(20, 64);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3d5a6c,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid visual
        const gridHelper = new THREE.GridHelper(40, 40, 0x19547b, 0x2a6f97);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Clase Edificio
        class Building {
            constructor(x, z) {
                this.group = new THREE.Group();
                this.x = x;
                this.z = z;
                this.targetHeight = 1 + Math.random() * 8;
                this.currentHeight = 0.1;
                this.width = 0.5 + Math.random() * 1;
                this.depth = 0.5 + Math.random() * 1;
                this.growthSpeed = 0.02 + Math.random() * 0.03;
                this.isGrowing = true;
                this.floors = [];
                this.population = Math.floor(this.targetHeight * 50);
                
                // Color base del edificio
                const hue = Math.random() * 0.15 + 0.55; // Azules y verdes
                this.baseColor = new THREE.Color().setHSL(hue, 0.6, 0.5);
                
                this.group.position.set(x, 0, z);
                scene.add(this.group);
                
                this.createBase();
            }

            createBase() {
                const baseGeometry = new THREE.BoxGeometry(this.width, 0.2, this.depth);
                const baseMaterial = new THREE.MeshStandardMaterial({ 
                    color: this.baseColor,
                    roughness: 0.7,
                    metalness: 0.3
                });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = 0.1;
                base.castShadow = true;
                base.receiveShadow = true;
                this.group.add(base);
            }

            grow() {
                if (!this.isGrowing) return false;

                this.currentHeight += this.growthSpeed;
                
                if (this.currentHeight >= this.targetHeight) {
                    this.currentHeight = this.targetHeight;
                    this.isGrowing = false;
                }

                // Construir pisos mientras crece
                const floorsNeeded = Math.floor(this.currentHeight / 0.5);
                while (this.floors.length < floorsNeeded) {
                    this.addFloor(this.floors.length);
                }

                return this.isGrowing;
            }

            addFloor(floorNumber) {
                const floorHeight = 0.4;
                const floorY = 0.2 + floorNumber * 0.5;
                
                // Estructura del piso
                const floorGeometry = new THREE.BoxGeometry(
                    this.width * 0.95,
                    floorHeight,
                    this.depth * 0.95
                );
                
                const floorMaterial = new THREE.MeshStandardMaterial({ 
                    color: this.baseColor.clone().multiplyScalar(0.9 + Math.random() * 0.2),
                    roughness: 0.6,
                    metalness: 0.4
                });
                
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.position.y = floorY;
                floor.castShadow = true;
                floor.receiveShadow = true;
                this.group.add(floor);
                
                // Ventanas
                this.addWindows(floor, floorY);
                
                this.floors.push(floor);
            }

            addWindows(floor, floorY) {
                const windowCount = Math.floor(Math.random() * 3) + 2;
                for (let i = 0; i < windowCount; i++) {
                    const windowGeometry = new THREE.BoxGeometry(0.15, 0.2, 0.05);
                    const isLit = Math.random() > 0.3;
                    const windowMaterial = new THREE.MeshStandardMaterial({ 
                        color: isLit ? 0xffff88 : 0x333333,
                        emissive: isLit ? 0xffff88 : 0x000000,
                        emissiveIntensity: isLit ? 0.5 : 0
                    });
                    
                    const window = new THREE.Mesh(windowGeometry, windowMaterial);
                    const angle = (i / windowCount) * Math.PI * 2;
                    const radius = Math.max(this.width, this.depth) * 0.5;
                    window.position.x = Math.cos(angle) * radius;
                    window.position.z = Math.sin(angle) * radius;
                    window.position.y = floorY;
                    window.lookAt(0, floorY, 0);
                    this.group.add(window);
                }
            }

            remove() {
                scene.remove(this.group);
            }
        }

        // Gestor de la ciudad
        const buildings = [];
        let autoMode = false;
        let autoTimer = 0;

        function addBuilding(x, z) {
            // Verificar que no haya otro edificio muy cerca
            const tooClose = buildings.some(b => {
                const dist = Math.sqrt((b.x - x) ** 2 + (b.z - z) ** 2);
                return dist < 1.5;
            });
            
            if (!tooClose && buildings.length < 100) {
                buildings.push(new Building(x, z));
                updateStats();
            }
        }

        function generateDistrict() {
            const centerX = (Math.random() - 0.5) * 10;
            const centerZ = (Math.random() - 0.5) * 10;
            const buildingCount = 5 + Math.floor(Math.random() * 8);
            
            for (let i = 0; i < buildingCount; i++) {
                const angle = (i / buildingCount) * Math.PI * 2;
                const radius = 2 + Math.random() * 3;
                const x = centerX + Math.cos(angle) * radius;
                const z = centerZ + Math.sin(angle) * radius;
                
                setTimeout(() => {
                    addBuilding(x, z);
                }, i * 200);
            }
        }

        function clearCity() {
            buildings.forEach(b => b.remove());
            buildings.length = 0;
            updateStats();
        }

        function updateStats() {
            document.getElementById('buildingCount').textContent = buildings.length;
            const totalPop = buildings.reduce((sum, b) => sum + b.population, 0);
            document.getElementById('population').textContent = totalPop.toLocaleString();
            const energy = Math.max(0, 100 - buildings.length * 2);
            document.getElementById('energy').textContent = energy + '%';
        }

        // Interacción con mouse
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            
            if (intersects.length > 0) {
                const point = intersects[0].point;
                addBuilding(point.x, point.z);
            }
        });

        // Control de cámara
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                cameraRotation.y += deltaX * 0.005;
                cameraRotation.x += deltaY * 0.005;
                cameraRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.x));
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Botones
        document.getElementById('clearBtn').addEventListener('click', clearCity);
        document.getElementById('autoBtn').addEventListener('click', () => {
            autoMode = !autoMode;
            document.getElementById('autoBtn').textContent = autoMode ? '⏸️ Pausar Auto' : '🤖 Auto-Construcción';
        });

        // Teclado
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                generateDistrict();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Crear ciudad inicial
        generateDistrict();

        // Loop de animación
        function animate() {
            requestAnimationFrame(animate);

            // Hacer crecer edificios
            buildings.forEach(building => {
                building.grow();
            });

            // Modo automático
            if (autoMode) {
                autoTimer++;
                if (autoTimer > 60 && buildings.length < 80) {
                    const x = (Math.random() - 0.5) * 15;
                    const z = (Math.random() - 0.5) * 15;
                    addBuilding(x, z);
                    autoTimer = 0;
                }
            }

            // Actualizar posición de cámara
            const radius = 20;
            camera.position.x = Math.sin(cameraRotation.y) * radius * Math.cos(cameraRotation.x);
            camera.position.y = 15 + Math.sin(cameraRotation.x) * 10;
            camera.position.z = Math.cos(cameraRotation.y) * radius * Math.cos(cameraRotation.x);
            camera.lookAt(0, 2, 0);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
