<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tensor Garden — Velvet</title>
<style>
    html, body {
        margin:0;
        overflow:hidden;
        background:#050507;
        font-family:system-ui;
    }

    #ui {
        position:fixed;
        top:10px;
        left:10px;
        background:rgba(0,0,0,.55);
        backdrop-filter: blur(6px);
        color:#fff;
        padding:12px;
        border-radius:12px;
        font-size:14px;
    }

    button{
        background:#10a37f;
        border:none;
        color:#000;
        font-weight:bold;
        padding:6px 10px;
        border-radius:8px;
        cursor:pointer;
    }

    #toggle{
        position:fixed;
        bottom:12px;
        right:12px;
        border-radius:50%;
        width:42px;
        height:42px;
        font-size:18px;
    }
</style>
</head>
<body>

<div id="ui">
    🌱 Tensor Garden<br/>
    toca / click = sembrar<br/>
    arrastra = viento<br/>
</div>

<button id="toggle">◐</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);
camera.position.z = 40;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const particles = [];
const MAX = 1200;

const geometry = new THREE.SphereGeometry(0.15, 6, 6);

function createParticle(x,y){
    const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6)
    });

    const mesh = new THREE.Mesh(geometry, mat);

    mesh.position.set(x,y,0);

    scene.add(mesh);

    particles.push({
        mesh,
        vx:(Math.random()-.5)*.4,
        vy:(Math.random()-.5)*.4
    });

    if(particles.length > MAX){
        const old = particles.shift();
        scene.remove(old.mesh);
    }
}

function screenToWorld(px,py){
    const v = new THREE.Vector3(
        (px/window.innerWidth)*2-1,
        -(py/window.innerHeight)*2+1,
        0
    );
    v.unproject(camera);
    return v;
}

function spawn(e){
    const p = screenToWorld(
        e.touches?e.touches[0].clientX:e.clientX,
        e.touches?e.touches[0].clientY:e.clientY
    );

    for(let i=0;i<6;i++){
        createParticle(
            p.x + (Math.random()-.5)*1.5,
            p.y + (Math.random()-.5)*1.5
        );
    }
}

window.addEventListener("pointerdown", spawn);
window.addEventListener("touchstart", spawn);

let wind = {x:0,y:0};

window.addEventListener("pointermove", e=>{
    wind.x = (e.movementX||0)*0.0008;
    wind.y = (e.movementY||0)*0.0008;
});

function update(){

    for(let i=0;i<particles.length;i++){

        const a = particles[i];

        for(let j=i+1;j<particles.length;j++){
            const b = particles[j];

            const dx = b.mesh.position.x - a.mesh.position.x;
            const dy = b.mesh.position.y - a.mesh.position.y;

            const d2 = dx*dx + dy*dy;

            if(d2 < 25 && d2 > 0.001){
                const f = 0.0006/d2;

                a.vx += dx*f;
                a.vy += dy*f;
                b.vx -= dx*f;
                b.vy -= dy*f;
            }
        }

        a.vx += wind.x;
        a.vy -= wind.y;

        a.vx *= .995;
        a.vy *= .995;

        a.mesh.position.x += a.vx;
        a.mesh.position.y += a.vy;
    }
}

function animate(){
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

const ui = document.getElementById("ui");
document.getElementById("toggle").onclick=()=>{
    ui.style.display = ui.style.display==="none"?"block":"none";
};
</script>

</body>
</html>
