<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M87* Black Hole - Ultra HD</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #info h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,150,50,0.8);
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">
        <h1>M87* BLACK HOLE - ULTRA</h1>
        <div>6.5 billion M☉ | 55 million light-years</div>
        <div style="margin-top: 8px; opacity: 0.7;">Arrastra • Scroll • Espacio para reset</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.015);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 4, 10);
        camera.lookAt(0, 0, 0);

        const BH_RADIUS = 1.5;
        const PHOTON_SPHERE = 2.6;
        const DISK_INNER = 3.2;
        const DISK_OUTER = 9;

        // ==================== SHADER ÉPICO DEL DISCO ====================
        const diskVertexShader = `
            varying vec3 vPosition;
            varying vec3 vNormal;
            varying float vDistance;
            
            void main() {
                vPosition = position;
                vNormal = normal;
                vDistance = length(position);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const diskFragmentShader = `
            uniform float time;
            varying vec3 vPosition;
            varying vec3 vNormal;
            varying float vDistance;
            
            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
            }
            
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }
            
            float fbm(vec2 p) {
                float value = 0.0;
                float amplitude = 0.5;
                for(int i = 0; i < 5; i++) {
                    value += amplitude * noise(p);
                    p *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }
            
            void main() {
                float dist = length(vPosition.xz);
                float angle = atan(vPosition.z, vPosition.x);
                
                // Distancia al anillo de fotones con falloff gaussiano
                float ringDist = abs(dist - 2.6);
                float ringIntensity = exp(-ringDist * ringDist * 3.5);
                
                // Efecto Doppler relativista (lado que se acerca más brillante)
                float doppler = 1.5 + 1.2 * sin(angle + time * 0.3);
                
                // Turbulencia multi-escala
                vec2 turbCoord = vec2(angle * 8.0, dist * 3.0);
                float turbulence = fbm(turbCoord + time * 0.2);
                turbulence = turbulence * 0.6 + 0.4;
                
                // Vórtices (swirls) en el disco
                float swirl = sin(angle * 12.0 + dist * 2.0 - time * 2.0) * 0.5 + 0.5;
                swirl = pow(swirl, 3.0) * 0.4;
                
                // Intensidad combinada
                float baseIntensity = (0.25 + ringIntensity * 1.2) * doppler;
                float intensity = baseIntensity * turbulence + swirl;
                intensity = clamp(intensity, 0.0, 1.5);
                
                // Gradiente de temperatura (blackbody radiation)
                vec3 color;
                if (intensity < 0.25) {
                    // Rojo oscuro
                    color = vec3(intensity * 2.0, intensity * 0.3, 0.0);
                } else if (intensity < 0.5) {
                    // Rojo a naranja
                    float t = (intensity - 0.25) / 0.25;
                    color = mix(vec3(0.5, 0.075, 0.0), vec3(1.0, 0.4, 0.05), t);
                } else if (intensity < 0.8) {
                    // Naranja a amarillo
                    float t = (intensity - 0.5) / 0.3;
                    color = mix(vec3(1.0, 0.4, 0.05), vec3(1.0, 0.9, 0.2), t);
                } else {
                    // Amarillo a blanco (más caliente)
                    float t = (intensity - 0.8) / 0.7;
                    color = mix(vec3(1.0, 0.9, 0.2), vec3(1.0, 1.0, 1.0), t);
                }
                
                // Chromatic aberration sutil en los bordes
                if (dist > 7.5) {
                    color.r *= 1.2;
                    color.b *= 0.8;
                }
                
                // Fade suave en los bordes
                float edgeFade = 1.0;
                if (dist > 8.0) {
                    edgeFade = 1.0 - smoothstep(8.0, 9.0, dist);
                }
                if (dist < 3.5) {
                    edgeFade = smoothstep(3.2, 3.8, dist);
                }
                
                float alpha = intensity * edgeFade * 0.85;
                gl_FragColor = vec4(color * intensity, alpha);
            }
        `;

        // Disco principal
        const diskGeometry = new THREE.RingGeometry(DISK_INNER, DISK_OUTER, 256, 128);
        const diskMaterial = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: diskVertexShader,
            fragmentShader: diskFragmentShader,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        
        const disk = new THREE.Mesh(diskGeometry, diskMaterial);
        disk.rotation.x = -Math.PI / 2 + 0.4;
        scene.add(disk);

        // ==================== ANILLO DE FOTONES ÉPICO ====================
        const photonCount = 5000;
        const photonPos = new Float32Array(photonCount * 3);
        const photonColors = new Float32Array(photonCount * 3);
        const photonSizes = new Float32Array(photonCount);

        for (let i = 0; i < photonCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = PHOTON_SPHERE + (Math.random() - 0.5) * 0.5;
            const y = (Math.random() - 0.5) * 0.4;
            
            photonPos[i * 3] = Math.cos(angle) * radius;
            photonPos[i * 3 + 1] = y;
            photonPos[i * 3 + 2] = Math.sin(angle) * radius;
            
            const brightness = 0.6 + Math.random() * 0.4;
            photonColors[i * 3] = 1.0;
            photonColors[i * 3 + 1] = 0.85 * brightness;
            photonColors[i * 3 + 2] = 0.4 * brightness;
            
            photonSizes[i] = 0.08 + Math.random() * 0.12;
        }

        const photonGeom = new THREE.BufferGeometry();
        photonGeom.setAttribute('position', new THREE.BufferAttribute(photonPos, 3));
        photonGeom.setAttribute('color', new THREE.BufferAttribute(photonColors, 3));
        photonGeom.setAttribute('size', new THREE.BufferAttribute(photonSizes, 1));

        const photonMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true
        });

        const photonRing = new THREE.Points(photonGeom, photonMat);
        scene.add(photonRing);

        // ==================== JETS RELATIVISTAS ====================
        function createJet(direction) {
            const jetParticles = 800;
            const jetPos = new Float32Array(jetParticles * 3);
            const jetColors = new Float32Array(jetParticles * 3);
            
            for (let i = 0; i < jetParticles; i++) {
                const t = i / jetParticles;
                const dist = 2 + t * 15;
                const spread = t * 0.3;
                
                jetPos[i * 3] = (Math.random() - 0.5) * spread;
                jetPos[i * 3 + 1] = dist * direction;
                jetPos[i * 3 + 2] = (Math.random() - 0.5) * spread;
                
                const brightness = (1 - t) * 0.6;
                jetColors[i * 3] = 0.3 + brightness;
                jetColors[i * 3 + 1] = 0.5 + brightness * 0.5;
                jetColors[i * 3 + 2] = 1.0;
            }
            
            const jetGeom = new THREE.BufferGeometry();
            jetGeom.setAttribute('position', new THREE.BufferAttribute(jetPos, 3));
            jetGeom.setAttribute('color', new THREE.BufferAttribute(jetColors, 3));
            
            const jetMat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.4
            });
            
            return new THREE.Points(jetGeom, jetMat);
        }

        const jetTop = createJet(1);
        const jetBottom = createJet(-1);
        scene.add(jetTop);
        scene.add(jetBottom);

        // ==================== RADIACIÓN DE HAWKING ====================
        const hawkingCount = 400;
        const hawkingPos = new Float32Array(hawkingCount * 3);
        const hawkingVel = [];

        for (let i = 0; i < hawkingCount; i++) {
            hawkingPos[i * 3] = (Math.random() - 0.5) * 0.5;
            hawkingPos[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
            hawkingPos[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
            
            hawkingVel.push({
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02,
                life: Math.random()
            });
        }

        const hawkingGeom = new THREE.BufferGeometry();
        hawkingGeom.setAttribute('position', new THREE.BufferAttribute(hawkingPos, 3));

        const hawkingMat = new THREE.PointsMaterial({
            color: 0xffdd88,
            size: 0.06,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.7
        });

        const hawking = new THREE.Points(hawkingGeom, hawkingMat);
        scene.add(hawking);

        // ==================== HORIZONTE DE EVENTOS ====================
        const horizonGeom = new THREE.CircleGeometry(BH_RADIUS, 64);
        const horizonMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000,
            side: THREE.DoubleSide
        });
        const horizon = new THREE.Mesh(horizonGeom, horizonMat);
        horizon.rotation.x = -Math.PI / 2 + 0.4;
        scene.add(horizon);

        // Glow del horizonte
        const glowGeom = new THREE.RingGeometry(BH_RADIUS, BH_RADIUS + 0.2, 64);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xff4400,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const horizonGlow = new THREE.Mesh(glowGeom, glowMat);
        horizonGlow.rotation.x = -Math.PI / 2 + 0.4;
        scene.add(horizonGlow);

        // ==================== ESTRELLAS DE FONDO ====================
        const starsGeom = new THREE.BufferGeometry();
        const starsPos = new Float32Array(1000 * 3);
        const starsColors = new Float32Array(1000 * 3);
        
        for (let i = 0; i < 1000; i++) {
            starsPos[i * 3] = (Math.random() - 0.5) * 200;
            starsPos[i * 3 + 1] = (Math.random() - 0.5) * 200;
            starsPos[i * 3 + 2] = (Math.random() - 0.5) * 200;
            
            const temp = Math.random();
            starsColors[i * 3] = temp > 0.7 ? 0.8 : 1.0;
            starsColors[i * 3 + 1] = temp > 0.5 ? 0.9 : 1.0;
            starsColors[i * 3 + 2] = 1.0;
        }
        
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGeom.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));
        
        const starsMat = new THREE.PointsMaterial({
            size: 0.06,
            vertexColors: true,
            transparent: true,
            opacity: 0.7
        });
        
        const stars = new THREE.Points(starsGeom, starsMat);
        scene.add(stars);

        // ==================== CONTROLES ====================
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };

        const onMouseDown = (e) => {
            isDragging = true;
            prevMouse = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
        };

        const onMouseMove = (e) => {
            if (!isDragging) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            rotation.y += (x - prevMouse.x) * 0.005;
            rotation.x += (y - prevMouse.y) * 0.005;
            rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotation.x));
            prevMouse = { x, y };
        };

        const onMouseUp = () => { isDragging = false; };

        renderer.domElement.addEventListener('mousedown', onMouseDown);
        renderer.domElement.addEventListener('mousemove', onMouseMove);
        renderer.domElement.addEventListener('mouseup', onMouseUp);
        renderer.domElement.addEventListener('touchstart', onMouseDown);
        renderer.domElement.addEventListener('touchmove', onMouseMove);
        renderer.domElement.addEventListener('touchend', onMouseUp);

        renderer.domElement.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(6, Math.min(20, camera.position.z));
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                rotation = { x: 0, y: 0 };
                camera.position.set(0, 4, 10);
            }
        });

        // ==================== ANIMACIÓN ====================
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            diskMaterial.uniforms.time.value = time;

            // Rotar anillo de fotones
            photonRing.rotation.y += 0.004;

            // Animar jets
            jetTop.rotation.y += 0.001;
            jetBottom.rotation.y -= 0.001;

            // Radiación de Hawking
            const positions = hawking.geometry.attributes.position.array;
            for (let i = 0; i < hawkingCount; i++) {
                positions[i * 3] += hawkingVel[i].x;
                positions[i * 3 + 1] += hawkingVel[i].y;
                positions[i * 3 + 2] += hawkingVel[i].z;
                
                hawkingVel[i].life -= 0.003;
                if (hawkingVel[i].life <= 0) {
                    positions[i * 3] = (Math.random() - 0.5) * 0.5;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
                    hawkingVel[i] = {
                        x: (Math.random() - 0.5) * 0.02,
                        y: (Math.random() - 0.5) * 0.02,
                        z: (Math.random() - 0.5) * 0.02,
                        life: 1
                    };
                }
            }
            hawking.geometry.attributes.position.needsUpdate = true;

            // Cámara orbital
            const dist = camera.position.length();
            camera.position.x = Math.sin(rotation.y) * Math.cos(rotation.x) * dist;
            camera.position.y = 4 + Math.sin(rotation.x) * dist * 0.3;
            camera.position.z = Math.cos(rotation.y) * Math.cos(rotation.x) * dist;
            camera.lookAt(0, 0, 0);

            stars.rotation.y += 0.0002;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
