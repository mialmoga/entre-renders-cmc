<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuario Biodinámico</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #001a33 0%, #003d5c 50%, #004d66 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 26, 51, 0.85);
            padding: 20px;
            border-radius: 15px;
            font-size: 13px;
            max-width: 300px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 200, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
        }
        #info h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }
        #info p {
            margin: 8px 0;
            line-height: 1.6;
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 26, 51, 0.85);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 200, 255, 0.4);
            min-width: 200px;
        }
        .stat {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-size: 14px;
        }
        .stat-value {
            color: #00d4ff;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(0, 150, 200, 0.3));
            border: 2px solid #00d4ff;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px 0;
            width: 100%;
            font-size: 13px;
        }
        button:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.5), rgba(0, 150, 200, 0.5));
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }
        button:active {
            transform: translateY(0);
        }
        #soundToggle {
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.3), rgba(200, 50, 0, 0.3));
            border-color: #ff6400;
        }
        #soundToggle:hover {
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.5), rgba(200, 50, 0, 0.5));
            box-shadow: 0 5px 20px rgba(255, 100, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🌊 Acuario Biodinámico</h2>
        <p><strong>🖱️ Click:</strong> Crear corriente de agua</p>
        <p><strong>🐠 Criaturas:</strong> Nadan con comportamiento de cardumen</p>
        <p><strong>🌊 Fluidos:</strong> Física de agua en tiempo real</p>
        <p><strong>🎵 Sonido:</strong> Ambiente generativo</p>
        <p><strong>🌿 Algas:</strong> Se mueven con las corrientes</p>
    </div>

    <div class="control-panel">
        <div class="stat">
            <span>🐟 Peces:</span>
            <span class="stat-value" id="fishCount">0</span>
        </div>
        <div class="stat">
            <span>🌿 Plantas:</span>
            <span class="stat-value" id="plantCount">0</span>
        </div>
        <div class="stat">
            <span>🌊 Corrientes:</span>
            <span class="stat-value" id="currentCount">0</span>
        </div>
        <button id="addFishBtn">🐠 Agregar Peces</button>
        <button id="addPlantBtn">🌿 Agregar Algas</button>
        <button id="soundToggle">🔊 Sonido: ON</button>
        <button id="resetBtn">🔄 Reiniciar</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuración de audio
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();
        let soundEnabled = true;
        let masterGain = audioContext.createGain();
        masterGain.gain.value = 0.3;
        masterGain.connect(audioContext.destination);

        // Función para crear tonos ambientales
        function playAmbientTone(frequency, duration = 0.5) {
            if (!soundEnabled) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(masterGain);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // Setup Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x001a33);
        scene.fog = new THREE.FogExp2(0x003d5c, 0.05);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0x4488ff, 0.4);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0x88ccff, 0.6);
        topLight.position.set(0, 10, 0);
        scene.add(topLight);

        const sideLight1 = new THREE.PointLight(0x00d4ff, 0.5, 30);
        sideLight1.position.set(-10, 5, 0);
        scene.add(sideLight1);

        const sideLight2 = new THREE.PointLight(0x0088ff, 0.5, 30);
        sideLight2.position.set(10, 5, 0);
        scene.add(sideLight2);

        // Partículas de agua (simulación de fluidos)
        class WaterParticle {
            constructor(x, y, z) {
                this.position = new THREE.Vector3(x, y, z);
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.force = new THREE.Vector3(0, 0, 0);
                this.life = 1.0;
            }

            applyForce(force) {
                this.force.add(force);
            }

            update() {
                this.velocity.add(this.force);
                this.velocity.multiplyScalar(0.98); // Fricción
                this.position.add(this.velocity);
                this.force.set(0, 0, 0);
                this.life *= 0.99;

                // Límites del acuario
                if (this.position.x < -12) { this.position.x = -12; this.velocity.x *= -0.5; }
                if (this.position.x > 12) { this.position.x = 12; this.velocity.x *= -0.5; }
                if (this.position.y < -6) { this.position.y = -6; this.velocity.y *= -0.5; }
                if (this.position.y > 6) { this.position.y = 6; this.velocity.y *= -0.5; }
                if (this.position.z < -12) { this.position.z = -12; this.velocity.z *= -0.5; }
                if (this.position.z > 12) { this.position.z = 12; this.velocity.z *= -0.5; }
            }
        }

        // Sistema de fluidos
        const waterParticles = [];
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 500;
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const particle = new WaterParticle(
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 20
            );
            waterParticles.push(particle);
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x4488ff,
            size: 0.15,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // Corrientes de agua
        const waterCurrents = [];

        class WaterCurrent {
            constructor(x, y, z) {
                this.position = new THREE.Vector3(x, y, z);
                this.strength = 0.5;
                this.radius = 3;
                this.life = 1.0;
                this.age = 0;

                // Visual
                const geometry = new THREE.SphereGeometry(0.5, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.5,
                    wireframe: true
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);

                playAmbientTone(200 + Math.random() * 200, 1.0);
            }

            update() {
                this.age += 0.016;
                this.life = Math.max(0, 1 - this.age / 3);
                this.radius = 3 + this.age * 2;
                this.strength = this.life * 0.5;
                
                this.mesh.scale.setScalar(this.radius / 0.5);
                this.mesh.material.opacity = this.life * 0.3;

                return this.life > 0;
            }

            remove() {
                scene.remove(this.mesh);
            }
        }

        // Criaturas (peces)
        class Fish {
            constructor(x, y, z, color) {
                this.position = new THREE.Vector3(x, y, z);
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.1
                );
                this.acceleration = new THREE.Vector3(0, 0, 0);
                this.maxSpeed = 0.15;
                this.maxForce = 0.005;
                this.color = color;

                // Cuerpo del pez
                this.group = new THREE.Group();
                
                const bodyGeometry = new THREE.ConeGeometry(0.15, 0.5, 8);
                const bodyMaterial = new THREE.MeshPhongMaterial({
                    color: this.color,
                    shininess: 80,
                    emissive: this.color,
                    emissiveIntensity: 0.2
                });
                this.body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                this.body.rotation.x = Math.PI / 2;
                this.group.add(this.body);

                // Cola
                const tailGeometry = new THREE.ConeGeometry(0.1, 0.2, 6);
                const tailMaterial = new THREE.MeshPhongMaterial({
                    color: this.color,
                    shininess: 80
                });
                this.tail = new THREE.Mesh(tailGeometry, tailMaterial);
                this.tail.rotation.x = Math.PI / 2;
                this.tail.position.z = -0.25;
                this.group.add(this.tail);

                this.group.position.copy(this.position);
                scene.add(this.group);

                this.swimPhase = Math.random() * Math.PI * 2;
            }

            applyForce(force) {
                this.acceleration.add(force);
            }

            flock(fishes) {
                let separation = this.separate(fishes);
                let alignment = this.align(fishes);
                let cohesion = this.cohesion(fishes);

                separation.multiplyScalar(1.5);
                alignment.multiplyScalar(1.0);
                cohesion.multiplyScalar(1.0);

                this.applyForce(separation);
                this.applyForce(alignment);
                this.applyForce(cohesion);
            }

            separate(fishes) {
                let desiredSeparation = 1.5;
                let steer = new THREE.Vector3(0, 0, 0);
                let count = 0;

                fishes.forEach(other => {
                    let d = this.position.distanceTo(other.position);
                    if (d > 0 && d < desiredSeparation) {
                        let diff = new THREE.Vector3().subVectors(this.position, other.position);
                        diff.normalize();
                        diff.divideScalar(d);
                        steer.add(diff);
                        count++;
                    }
                });

                if (count > 0) {
                    steer.divideScalar(count);
                }

                if (steer.length() > 0) {
                    steer.normalize();
                    steer.multiplyScalar(this.maxSpeed);
                    steer.sub(this.velocity);
                    steer.clampLength(0, this.maxForce);
                }

                return steer;
            }

            align(fishes) {
                let neighborDist = 3;
                let sum = new THREE.Vector3(0, 0, 0);
                let count = 0;

                fishes.forEach(other => {
                    let d = this.position.distanceTo(other.position);
                    if (d > 0 && d < neighborDist) {
                        sum.add(other.velocity);
                        count++;
                    }
                });

                if (count > 0) {
                    sum.divideScalar(count);
                    sum.normalize();
                    sum.multiplyScalar(this.maxSpeed);
                    let steer = new THREE.Vector3().subVectors(sum, this.velocity);
                    steer.clampLength(0, this.maxForce);
                    return steer;
                }

                return new THREE.Vector3(0, 0, 0);
            }

            cohesion(fishes) {
                let neighborDist = 3;
                let sum = new THREE.Vector3(0, 0, 0);
                let count = 0;

                fishes.forEach(other => {
                    let d = this.position.distanceTo(other.position);
                    if (d > 0 && d < neighborDist) {
                        sum.add(other.position);
                        count++;
                    }
                });

                if (count > 0) {
                    sum.divideScalar(count);
                    return this.seek(sum);
                }

                return new THREE.Vector3(0, 0, 0);
            }

            seek(target) {
                let desired = new THREE.Vector3().subVectors(target, this.position);
                desired.normalize();
                desired.multiplyScalar(this.maxSpeed);
                let steer = new THREE.Vector3().subVectors(desired, this.velocity);
                steer.clampLength(0, this.maxForce);
                return steer;
            }

            update() {
                this.velocity.add(this.acceleration);
                this.velocity.clampLength(0, this.maxSpeed);
                this.position.add(this.velocity);
                this.acceleration.multiplyScalar(0);

                // Límites del acuario con comportamiento de rebote suave
                const margin = 10;
                if (this.position.x < -margin) {
                    this.applyForce(new THREE.Vector3(this.maxForce, 0, 0));
                }
                if (this.position.x > margin) {
                    this.applyForce(new THREE.Vector3(-this.maxForce, 0, 0));
                }
                if (this.position.y < -5) {
                    this.applyForce(new THREE.Vector3(0, this.maxForce, 0));
                }
                if (this.position.y > 5) {
                    this.applyForce(new THREE.Vector3(0, -this.maxForce, 0));
                }
                if (this.position.z < -margin) {
                    this.applyForce(new THREE.Vector3(0, 0, this.maxForce));
                }
                if (this.position.z > margin) {
                    this.applyForce(new THREE.Vector3(0, 0, -this.maxForce));
                }

                // Actualizar posición visual
                this.group.position.copy(this.position);

                // Orientar hacia la dirección de movimiento
                if (this.velocity.length() > 0.01) {
                    const direction = this.velocity.clone().normalize();
                    this.group.lookAt(this.position.clone().add(direction));
                }

                // Animación de nado
                this.swimPhase += 0.1;
                this.tail.rotation.y = Math.sin(this.swimPhase) * 0.3;
            }

            remove() {
                scene.remove(this.group);
            }
        }

        // Plantas (algas)
        class Seaweed {
            constructor(x, z) {
                this.position = new THREE.Vector3(x, -6, z);
                this.segments = [];
                this.segmentCount = 8 + Math.floor(Math.random() * 5);
                
                const hue = 0.3 + Math.random() * 0.1;
                this.color = new THREE.Color().setHSL(hue, 0.7, 0.4);

                this.group = new THREE.Group();
                this.group.position.copy(this.position);

                for (let i = 0; i < this.segmentCount; i++) {
                    const geometry = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6);
                    const material = new THREE.MeshPhongMaterial({
                        color: this.color,
                        shininess: 30
                    });
                    const segment = new THREE.Mesh(geometry, material);
                    segment.position.y = i * 0.5 + 0.25;
                    
                    segment.userData = {
                        baseRotation: 0,
                        swaySpeed: 0.5 + Math.random() * 0.5,
                        swayAmount: 0.1 + Math.random() * 0.2
                    };
                    
                    this.group.add(segment);
                    this.segments.push(segment);
                }

                scene.add(this.group);
            }

            update(time, waterCurrents) {
                this.segments.forEach((segment, index) => {
                    const influence = index / this.segments.length;
                    let sway = Math.sin(time * segment.userData.swaySpeed + index * 0.5) * segment.userData.swayAmount;
                    
                    // Influencia de corrientes
                    waterCurrents.forEach(current => {
                        const dist = this.position.distanceTo(current.position);
                        if (dist < current.radius) {
                            const force = (1 - dist / current.radius) * current.strength;
                            sway += force * influence;
                        }
                    });
                    
                    segment.rotation.z = sway * influence;
                    segment.rotation.x = sway * 0.5 * influence;
                });
            }

            remove() {
                scene.remove(this.group);
            }
        }

        // Arrays de entidades
        const fishes = [];
        const seaweeds = [];

        // Funciones para agregar entidades
        function addFish() {
            const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xff8b94, 0x95e1d3];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const fish = new Fish(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 15,
                color
            );
            fishes.push(fish);
            updateStats();
            playAmbientTone(400 + Math.random() * 400, 0.3);
        }

        function addSeaweed() {
            const seaweed = new Seaweed(
                (Math.random() - 0.5) * 18,
                (Math.random() - 0.5) * 18
            );
            seaweeds.push(seaweed);
            updateStats();
            playAmbientTone(150 + Math.random() * 100, 0.5);
        }

        function updateStats() {
            document.getElementById('fishCount').textContent = fishes.length;
            document.getElementById('plantCount').textContent = seaweeds.length;
            document.getElementById('currentCount').textContent = waterCurrents.length;
        }

        // Inicializar ecosistema
        for (let i = 0; i < 15; i++) {
            setTimeout(() => addFish(), i * 100);
        }
        for (let i = 0; i < 10; i++) {
            setTimeout(() => addSeaweed(), i * 150);
        }

        // Interacción con mouse
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.at(10, intersectPoint);

            const current = new WaterCurrent(intersectPoint.x, intersectPoint.y, intersectPoint.z);
            waterCurrents.push(current);
            updateStats();
        });

        // Botones
        document.getElementById('addFishBtn').addEventListener('click', () => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => addFish(), i * 100);
            }
        });

        document.getElementById('addPlantBtn').addEventListener('click', () => {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => addSeaweed(), i * 100);
            }
        });

        document.getElementById('soundToggle').addEventListener('click', (e) => {
            soundEnabled = !soundEnabled;
            e.target.textContent = soundEnabled ? '🔊 Sonido: ON' : '🔇 Sonido: OFF';
            masterGain.gain.value = soundEnabled ? 0.3 : 0;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            fishes.forEach(f => f.remove());
            fishes.length = 0;
            seaweeds.forEach(s => s.remove());
            seaweeds.length = 0;
            waterCurrents.forEach(c => c.remove());
            waterCurrents.length = 0;
            
            for (let i = 0; i < 15; i++) {
                setTimeout(() => addFish(), i * 100);
            }
            for (let i = 0; i < 10; i++) {
                setTimeout(() => addSeaweed(), i * 150);
            }
            updateStats();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Ambiente sonoro de fondo
        let ambientSoundTimer = 0;

        // Loop principal
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Actualizar partículas de agua
            waterParticles.forEach((particle, index) => {
                // Aplicar corrientes
                waterCurrents.forEach(current => {
                    const dist = particle.position.distanceTo(current.position);
                    if (dist < current.radius) {
                        const force = new THREE.Vector3()
                            .subVectors(current.position, particle.position)
                            .normalize()
                            .multiplyScalar(current.strength * (1 - dist / current.radius) * 0.1);
                        particle.applyForce(force);
                    }
                });

                // Flotación natural
                const buoyancy = new THREE.Vector3(
                    Math.sin(time + index * 0.1) * 0.001,
                    Math.cos(time + index * 0.15) * 0.002,
                    Math.sin(time * 0.8 + index * 0.2) * 0.001
                );
                particle.applyForce(buoyancy);

                particle.update();

                particlePositions[index * 3] = particle.position.x;
                particlePositions[index * 3 + 1] = particle.position.y;
                particlePositions[index * 3 + 2] = particle.position.z;
            });
            particleGeometry.attributes.position.needsUpdate = true;

            // Actualizar corrientes
            for (let i = waterCurrents.length - 1; i >= 0; i--) {
                if (!waterCurrents[i].update()) {
                    waterCurrents[i].remove();
                    waterCurrents.splice(i, 1);
                    updateStats();
                }
            }

            // Actualizar peces
            fishes.forEach(fish => {
                fish.flock(fishes);
                
                // Evitar corrientes
                waterCurrents.forEach(current => {
                    const dist = fish.position.distanceTo(current.position);
                    if (dist < current.radius * 1.5) {
                        const avoidForce = new THREE.Vector3()
                            .subVectors(fish.position, current.position)
                            .normalize()
                            .multiplyScalar(fish.maxForce * 2);
                        fish.applyForce(avoidForce);
                    }
                });

                fish.update();
            });

            // Actualizar algas
            seaweeds.forEach(seaweed => {
                seaweed.update(time, waterCurrents);
            });

            // Sonido ambiente aleatorio
            ambientSoundTimer++;
            if (ambientSoundTimer > 120 && Math.random() > 0.95) {
                playAmbientTone(100 + Math.random() * 300, 2.0);
                ambientSoundTimer = 0;
            }

            // Rotar cámara suavemente
            camera.position.x = Math.sin(time * 0.05) * 15;
            camera.position.z = Math.cos(time * 0.05) * 15;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Iniciar audio context con interacción del usuario
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });

        animate();
        updateStats();
    </script>
</body>
</html>
