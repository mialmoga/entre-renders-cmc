<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox Autómata v0.1</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
        }
        
        .header {
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #888;
            font-size: 14px;
        }
        
        .main-layout {
            display: flex;
            gap: 24px;
        }
        
        .grid-container {
            flex-shrink: 0;
        }
        
        .grid {
            border: 2px solid #333;
            display: inline-block;
            background: #0a0a0a;
        }
        
        .cell {
            display: inline-block;
            background: #2a2a2a;
            position: relative;
        }
        
        .automata {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            font-size: 16px;
        }
        
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .card {
            background: #252525;
            padding: 20px;
            border-radius: 8px;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1d4ed8;
        }
        
        .btn-secondary {
            background: #404040;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #525252;
        }
        
        .stat {
            margin-bottom: 12px;
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .progress-bar {
            width: 100%;
            height: 16px;
            background: #404040;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            transition: all 0.3s;
            border-radius: 8px;
        }
        
        .stat-row {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        
        .stat-label {
            color: #888;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 6px;
        }
        
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        
        .log {
            flex: 1;
            min-height: 150px;
        }
        
        .log h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .log-content {
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            color: #4ade80;
            margin-bottom: 4px;
        }
        
        .log-empty {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GRID_SIZE = 20;
        const CELL_SIZE = 25;
        const TICK_SPEED = 200;

        const STIMULI = {
            LUMVYN: { color: '#ff4444', energy: 20, speed: -5, name: 'Lumvyn' },
            SOLVRYN: { color: '#44ff44', energy: -10, speed: 10, name: 'Solvryn' },
            NORYTH: { color: '#4444ff', energy: 5, speed: 0, name: 'Noryth' }
        };

        function SandboxAutomata() {
            const [grid, setGrid] = useState([]);
            const [automata, setAutomata] = useState({
                x: 10,
                y: 10,
                energy: 100,
                speed: 5,
                memory: []
            });
            const [running, setRunning] = useState(false);
            const [log, setLog] = useState([]);
            const intervalRef = useRef(null);

            useEffect(() => {
                initializeGrid();
            }, []);

            const initializeGrid = () => {
                const newGrid = Array(GRID_SIZE).fill(null).map(() => 
                    Array(GRID_SIZE).fill(null)
                );
                
                const stimuliTypes = Object.keys(STIMULI);
                for (let i = 0; i < 15; i++) {
                    const x = Math.floor(Math.random() * GRID_SIZE);
                    const y = Math.floor(Math.random() * GRID_SIZE);
                    const type = stimuliTypes[Math.floor(Math.random() * stimuliTypes.length)];
                    newGrid[y][x] = type;
                }
                
                setGrid(newGrid);
            };

            const addLog = (message) => {
                setLog(prev => [...prev.slice(-5), message]);
            };

            const moveAutomata = () => {
                setAutomata(prev => {
                    let newX = prev.x;
                    let newY = prev.y;
                    let newEnergy = prev.energy - 1;
                    let newSpeed = prev.speed;
                    const newMemory = [...prev.memory];

                    const directions = [
                        { dx: 0, dy: -1, name: 'arriba' },
                        { dx: 0, dy: 1, name: 'abajo' },
                        { dx: -1, dy: 0, name: 'izquierda' },
                        { dx: 1, dy: 0, name: 'derecha' }
                    ];
                    
                    const move = directions[Math.floor(Math.random() * directions.length)];
                    newX = Math.max(0, Math.min(GRID_SIZE - 1, prev.x + move.dx));
                    newY = Math.max(0, Math.min(GRID_SIZE - 1, prev.y + move.dy));

                    const stimulus = grid[newY]?.[newX];
                    if (stimulus) {
                        const stimData = STIMULI[stimulus];
                        newEnergy += stimData.energy;
                        newSpeed = Math.max(1, prev.speed + stimData.speed);
                        
                        newMemory.push({
                            type: stimulus,
                            effect: stimData.energy > 0 ? 'bueno' : 'malo',
                            location: { x: newX, y: newY }
                        });

                        addLog(`Consumí ${stimData.name}: energía ${stimData.energy > 0 ? '+' : ''}${stimData.energy}`);

                        setGrid(g => {
                            const newGrid = g.map(row => [...row]);
                            newGrid[newY][newX] = null;
                            return newGrid;
                        });
                    } else {
                        addLog(`Me moví ${move.name}`);
                    }

                    newEnergy = Math.max(0, Math.min(150, newEnergy));

                    if (newEnergy === 0) {
                        addLog('Sin energía... necesito Lumvyn');
                        setRunning(false);
                    }

                    return {
                        x: newX,
                        y: newY,
                        energy: newEnergy,
                        speed: newSpeed,
                        memory: newMemory.slice(-10)
                    };
                });
            };

            useEffect(() => {
                if (running) {
                    intervalRef.current = setInterval(moveAutomata, TICK_SPEED);
                } else {
                    if (intervalRef.current) clearInterval(intervalRef.current);
                }
                return () => {
                    if (intervalRef.current) clearInterval(intervalRef.current);
                };
            }, [running, grid]);

            const reset = () => {
                setRunning(false);
                setAutomata({
                    x: 10,
                    y: 10,
                    energy: 100,
                    speed: 5,
                    memory: []
                });
                setLog([]);
                initializeGrid();
            };

            const getEnergyColor = () => {
                if (automata.energy > 50) return '#44ff44';
                if (automata.energy > 20) return '#ffaa44';
                return '#ff4444';
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>Sandbox Autómata v0.1</h1>
                        <p>Prototipo: 1 autómata, movimiento aleatorio, 3 estímulos</p>
                    </div>

                    <div className="main-layout">
                        <div className="grid-container">
                            <div className="grid">
                                {grid.map((row, y) => (
                                    <div key={y} style={{ height: CELL_SIZE, whiteSpace: 'nowrap' }}>
                                        {row.map((cell, x) => (
                                            <div
                                                key={`${x}-${y}`}
                                                className="cell"
                                                style={{
                                                    width: CELL_SIZE,
                                                    height: CELL_SIZE,
                                                    backgroundColor: cell ? STIMULI[cell].color : '#2a2a2a'
                                                }}
                                            >
                                                {automata.x === x && automata.y === y && (
                                                    <div className="automata">🤖</div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="panel">
                            <div className="card">
                                <div className="controls">
                                    <button 
                                        onClick={() => setRunning(!running)}
                                        className="btn-primary"
                                    >
                                        {running ? '⏸ Pausar' : '▶ Iniciar'}
                                    </button>
                                    <button 
                                        onClick={reset}
                                        className="btn-secondary"
                                    >
                                        ↻ Reset
                                    </button>
                                </div>

                                <div className="stat">
                                    <div className="stat-header">
                                        <span>Energía</span>
                                        <span>{automata.energy}/150</span>
                                    </div>
                                    <div className="progress-bar">
                                        <div 
                                            className="progress-fill"
                                            style={{
                                                width: `${(automata.energy / 150) * 100}%`,
                                                backgroundColor: getEnergyColor()
                                            }}
                                        />
                                    </div>
                                </div>

                                <div className="stat-row">
                                    <span className="stat-label">Velocidad:</span> {automata.speed}
                                </div>
                                <div className="stat-row">
                                    <span className="stat-label">Posición:</span> ({automata.x}, {automata.y})
                                </div>
                                <div className="stat-row">
                                    <span className="stat-label">Memorias:</span> {automata.memory.length}
                                </div>
                            </div>

                            <div className="card">
                                <h3 style={{ marginBottom: '12px' }}>⚡ Estímulos</h3>
                                {Object.entries(STIMULI).map(([key, stim]) => (
                                    <div key={key} className="legend-item">
                                        <div 
                                            className="color-box"
                                            style={{ backgroundColor: stim.color }}
                                        />
                                        <span>{stim.name}:</span>
                                        <span style={{ color: '#888' }}>
                                            energía {stim.energy > 0 ? '+' : ''}{stim.energy}, 
                                            velocidad {stim.speed > 0 ? '+' : ''}{stim.speed}
                                        </span>
                                    </div>
                                ))}
                            </div>

                            <div className="card log">
                                <h3>Pensamientos</h3>
                                <div className="log-content">
                                    {log.length === 0 ? (
                                        <div className="log-empty">Esperando...</div>
                                    ) : (
                                        log.map((msg, i) => (
                                            <div key={i} className="log-entry">
                                                &gt; {msg}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<SandboxAutomata />, document.getElementById('root'));
    </script>
</body>
  </html>
