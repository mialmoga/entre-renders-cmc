<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M87* Black Hole - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
        #info h1 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #ddd;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>M87* - Event Horizon Telescope</h1>
        <div>6.5 billion solar masses</div>
        <div>Arrastra para rotar | Scroll para zoom</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Setup básico
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 3, 8);
        camera.lookAt(0, 0, 0);

        // Parámetros del agujero negro
        const BH_RADIUS = 1.5;
        const PHOTON_SPHERE = 2.6;
        const DISK_INNER = 3.5;
        const DISK_OUTER = 8;

        // Shader personalizado para el disco de acreción
        const diskVertexShader = `
            varying vec3 vPosition;
            varying vec2 vUv;
            varying float vDistance;
            
            void main() {
                vPosition = position;
                vUv = uv;
                vDistance = length(position);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const diskFragmentShader = `
            uniform float time;
            varying vec3 vPosition;
            varying vec2 vUv;
            varying float vDistance;
            
            // Noise function
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }
            
            void main() {
                float dist = length(vPosition.xz);
                float angle = atan(vPosition.z, vPosition.x);
                
                // Distancia al anillo de fotones
                float ringDist = abs(dist - 2.6);
                float ringIntensity = exp(-ringDist * ringDist * 2.0);
                
                // Efecto Doppler (lado derecho más brillante)
                float doppler = 1.2 + 0.8 * sin(angle + time * 0.5);
                
                // Turbulencia
                float noise = random(vec2(angle * 10.0, dist * 5.0 + time));
                float turbulence = noise * 0.3;
                
                // Intensidad total
                float intensity = (0.3 + ringIntensity) * doppler * (0.7 + turbulence);
                intensity = clamp(intensity, 0.0, 1.0);
                
                // Gradiente de color (rojo -> naranja -> amarillo -> blanco)
                vec3 color;
                if (intensity < 0.3) {
                    color = vec3(intensity * 3.0, intensity * 0.5, 0.0);
                } else if (intensity < 0.6) {
                    float t = (intensity - 0.3) / 0.3;
                    color = mix(vec3(0.9, 0.15, 0.0), vec3(1.0, 0.7, 0.1), t);
                } else {
                    float t = (intensity - 0.6) / 0.4;
                    color = mix(vec3(1.0, 0.7, 0.1), vec3(1.0, 1.0, 0.8), t);
                }
                
                // Fade out en los bordes
                float edgeFade = 1.0;
                if (dist > 7.0) {
                    edgeFade = 1.0 - (dist - 7.0);
                }
                if (dist < 3.8) {
                    edgeFade = (dist - 3.5) / 0.3;
                }
                
                gl_FragColor = vec4(color * intensity * edgeFade, intensity * edgeFade * 0.9);
            }
        `;

        // Crear disco de acreción con shader
        const diskGeometry = new THREE.RingGeometry(DISK_INNER, DISK_OUTER, 128, 64);
        const diskMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: diskVertexShader,
            fragmentShader: diskFragmentShader,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        
        const disk = new THREE.Mesh(diskGeometry, diskMaterial);
        disk.rotation.x = -Math.PI / 2 + 0.3; // Inclinación
        scene.add(disk);

        // Sistema de partículas para el anillo de fotones
        const particleCount = 3000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = PHOTON_SPHERE + (Math.random() - 0.5) * 0.4;
            const y = (Math.random() - 0.5) * 0.3;
            
            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = Math.sin(angle) * radius;
            
            const intensity = 0.7 + Math.random() * 0.3;
            colors[i * 3] = 1.0;
            colors[i * 3 + 1] = 0.8 * intensity;
            colors[i * 3 + 2] = 0.3 * intensity;
            
            sizes[i] = 0.1 + Math.random() * 0.15;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Sombra del agujero negro (horizonte de eventos)
        const shadowGeometry = new THREE.CircleGeometry(BH_RADIUS, 64);
        const shadowMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x000000,
            side: THREE.DoubleSide
        });
        const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);
        shadow.rotation.x = -Math.PI / 2 + 0.3;
        scene.add(shadow);

        // Glow sutil alrededor del horizonte
        const glowGeometry = new THREE.RingGeometry(BH_RADIUS, BH_RADIUS + 0.15, 64);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xff6600,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        glow.rotation.x = -Math.PI / 2 + 0.3;
        scene.add(glow);

        // Partículas de fondo (estrellas lejanas)
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = new Float32Array(500 * 3);
        for (let i = 0; i < 500; i++) {
            starsPositions[i * 3] = (Math.random() - 0.5) * 100;
            starsPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            starsPositions[i * 3 + 2] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            transparent: true,
            opacity: 0.6
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Controles de mouse
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                rotation.y += deltaX * 0.005;
                rotation.x += deltaY * 0.005;
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch controls para móvil
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { 
                x: e.touches[0].clientX, 
                y: e.touches[0].clientY 
            };
        });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                
                rotation.y += deltaX * 0.005;
                rotation.x += deltaY * 0.005;
                
                previousMousePosition = { 
                    x: e.touches[0].clientX, 
                    y: e.touches[0].clientY 
                };
            }
        });

        renderer.domElement.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Zoom con scroll
        renderer.domElement.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(5, Math.min(15, camera.position.z));
        });

        // Animación
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Actualizar shader del disco
            diskMaterial.uniforms.time.value = time;

            // Rotar partículas del anillo de fotones
            particles.rotation.y += 0.003;

            // Aplicar rotación de cámara
            camera.position.x = Math.sin(rotation.y) * camera.position.z;
            camera.position.z = Math.cos(rotation.y) * Math.abs(camera.position.z);
            camera.position.y = 3 + Math.sin(rotation.x) * 2;
            camera.lookAt(0, 0, 0);

            // Rotar estrellas de fondo lentamente
            stars.rotation.y += 0.0001;

            renderer.render(scene, camera);
        }

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
  </html>
