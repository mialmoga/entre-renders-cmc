<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Orbital Explorer • Final Edition</title>
    <style>
        :root { --accent: #64c8ff; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        
        #top-info { position: fixed; top: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        #orbital-label { font-size: 2.8rem; font-weight: 200; letter-spacing: 8px; opacity: 0.9; text-shadow: 0 0 20px var(--accent); color: var(--accent); }

        /* Menú Inferior Estilo App */
        #app-menu {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: repeat(5, 60px); gap: 10px;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 25px;
            backdrop-filter: blur(15px); border: 1px solid rgba(100,200,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
        }

        .menu-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .val-display { font-size: 1.2rem; font-weight: bold; height: 30px; color: var(--accent); }
        .label-tag { font-size: 0.6rem; opacity: 0.5; text-transform: uppercase; }
        
        .nav-btn {
            width: 44px; height: 44px; border-radius: 12px; border: none;
            background: rgba(255,255,255,0.08); color: white; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:active { background: var(--accent); color: #000; transform: scale(0.9); }
        
        .mode-btn { 
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--accent);
            background: transparent; color: var(--accent); font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .mode-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        .extra-tools { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<div id="top-info">
    <div id="orbital-label">4d₁</div>
</div>

<div id="app-menu">
    <div class="menu-col">
        <button class="nav-btn" onclick="updateN(1)">▲</button>
        <div class="val-display" id="val-n">4</div>
        <button class="nav-btn" onclick="updateN(-1)">▼</button>
        <div class="label-tag">n</div>
    </div>
    <div class="menu-col">
        <button class="nav-btn" onclick="updateL(1)">▲</button>
        <div class="val-display" id="val-l">2</div>
        <button class="nav-btn" onclick="updateL(-1)">▼</button>
        <div class="label-tag">l</div>
    </div>
    <div class="menu-col">
        <button class="nav-btn" onclick="updateM(1)">▲</button>
        <div class="val-display" id="val-m">1</div>
        <button class="nav-btn" onclick="updateM(-1)">▼</button>
        <div class="label-tag">m</div>
    </div>
    <div class="menu-col">
        <button class="mode-btn active" id="btn-mode" onclick="toggleMode()">ℂ</button>
        <button class="mode-btn" id="btn-axis" onclick="toggleAxis()" style="margin-top:14px">XYZ</button>
    </div>
    <div class="menu-col extra-tools">
        <button class="nav-btn" onclick="zoom(1.2)">🔍+</button>
        <button class="nav-btn" onclick="zoom(-1.2)">🔍-</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let n = 4, l = 2, m = 1;
let isComplex = true, showAxis = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 18;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- GENERADOR DE TEXTURA DE BRUMA ---
function createPointTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
    grad.addColorStop(0, 'rgba(255,255,255,0.8)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0.2)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
}

// --- EJES ---
const axisGroup = new THREE.Group();
const createLine = (c, v) => {
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), v.multiplyScalar(10)]);
    return new THREE.Line(g, new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.4 }));
};
axisGroup.add(createLine(0xff3333, new THREE.Vector3(1,0,0)));
axisGroup.add(createLine(0x33ff33, new THREE.Vector3(0,1,0)));
axisGroup.add(createLine(0x3333ff, new THREE.Vector3(0,0,1)));
scene.add(axisGroup);

// --- NUBE CUÁNTICA (100k partículas) ---
const partCount = 100000;
const geometry = new THREE.BufferGeometry();
const material = new THREE.PointsMaterial({ 
    size: 0.4, 
    map: createPointTexture(), 
    vertexColors: true, 
    transparent: true, 
    opacity: 0.5, 
    blending: THREE.AdditiveBlending, 
    depthWrite: false 
});
const points = new THREE.Points(geometry, material);
scene.add(points);

function generateOrbital() {
    const pos = [], col = [];
    const letters = ['s', 'p', 'd', 'f', 'g', 'h'];
    document.getElementById('orbital-label').innerText = `${n}${letters[l]}${m}`;
    
    for(let i = 0; i < partCount; i++) {
        const r = Math.random() * (n * n * 2);
        const theta = Math.random() * Math.PI;
        const phi = Math.random() * Math.PI * 2;

        // Aproximación de densidad probabilística |ψ|²
        const radial = Math.pow(r, l) * Math.exp(-r/n);
        const angular = Math.abs(Math.cos(theta * l + m));
        
        if (Math.random() < radial * angular * 0.5) {
            pos.push(r * Math.sin(theta) * Math.cos(phi), r * Math.sin(theta) * Math.sin(phi), r * Math.cos(theta));
            const hue = isComplex ? (phi / (Math.PI * 2)) : (Math.cos(theta * l) > 0 ? 0.6 : 0.05);
            const color = new THREE.Color().setHSL(hue, 0.9, 0.5);
            col.push(color.r, color.g, color.b);
        }
    }
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
}

// --- LOGICA APP ---
function zoom(d) { camera.position.z = Math.min(80, Math.max(3, camera.position.z - d)); }
function toggleAxis() { showAxis = !showAxis; axisGroup.visible = showAxis; document.getElementById('btn-axis').classList.toggle('active', showAxis); }
function toggleMode() { isComplex = !isComplex; document.getElementById('btn-mode').innerText = isComplex ? 'ℂ' : 'ℝ'; generateOrbital(); }
function updateN(v) { n = Math.max(1, n + v); syncUI(); }
function updateL(v) { l = Math.min(n - 1, Math.max(0, l + v)); syncUI(); }
function updateM(v) { m = Math.min(l, Math.max(-l, m + v)); syncUI(); }

function syncUI() {
    document.getElementById('val-n').innerText = n;
    document.getElementById('val-l').innerText = l;
    document.getElementById('val-m').innerText = m;
    generateOrbital();
}

function animate() {
    requestAnimationFrame(animate);
    points.rotation.y += 0.002;
    renderer.render(scene, camera);
}

// CONTROL TÁCTIL (ORBIT)
let isDown = false;
window.addEventListener('pointerdown', () => isDown = true);
window.addEventListener('pointerup', () => isDown = false);
window.addEventListener('pointermove', (e) => {
    if(isDown) {
        scene.rotation.y += e.movementX * 0.005;
        scene.rotation.x += e.movementY * 0.005;
    }
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

syncUI();
animate();
</script>
</body>
  </html>
