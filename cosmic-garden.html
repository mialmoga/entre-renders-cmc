<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín Cósmico Interactivo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000000;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #00ffff;
        }
        #info p {
            margin: 5px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🌌 Jardín Cósmico</h2>
        <p><strong>🖱️ Click:</strong> Crea flores cósmicas</p>
        <p><strong>💫 Mueve el ratón:</strong> Interactúa con las partículas</p>
        <p><strong>🎨 Colorido:</strong> Cada flor tiene su propia energía</p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuración básica
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 30;

        // Fondo estrellado
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        
        for(let i = 0; i < starCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 200;
        }
        
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.5,
            transparent: true,
            opacity: 0.8
        });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Array para almacenar las flores cósmicas
        const cosmicFlowers = [];
        
        // Clase para las flores cósmicas
        class CosmicFlower {
            constructor(x, y) {
                this.group = new THREE.Group();
                this.particles = [];
                this.time = 0;
                
                // Posición en 3D
                const vector = new THREE.Vector3(x, y, 0);
                vector.unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.z / dir.z;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                
                this.group.position.copy(pos);
                
                // Color aleatorio vibrante
                const hue = Math.random();
                const color = new THREE.Color().setHSL(hue, 1, 0.6);
                
                // Centro brillante
                const coreGeometry = new THREE.SphereGeometry(0.3, 16, 16);
                const coreMaterial = new THREE.MeshBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 0.8
                });
                const core = new THREE.Mesh(coreGeometry, coreMaterial);
                this.group.add(core);
                this.core = core;
                
                // Pétalos en espiral
                const petalCount = 8;
                for(let i = 0; i < petalCount; i++) {
                    const angle = (i / petalCount) * Math.PI * 2;
                    const petalGroup = new THREE.Group();
                    
                    // Geometría del pétalo
                    const petalGeometry = new THREE.ConeGeometry(0.2, 1.5, 4);
                    const petalMaterial = new THREE.MeshBasicMaterial({ 
                        color: color,
                        transparent: true,
                        opacity: 0.6,
                        side: THREE.DoubleSide
                    });
                    const petal = new THREE.Mesh(petalGeometry, petalMaterial);
                    
                    petal.rotation.x = Math.PI / 2;
                    petal.position.z = 0.75;
                    
                    petalGroup.rotation.z = angle;
                    petalGroup.add(petal);
                    this.group.add(petalGroup);
                }
                
                // Partículas orbitales
                for(let i = 0; i < 50; i++) {
                    const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                    const particleMaterial = new THREE.MeshBasicMaterial({ 
                        color: color,
                        transparent: true,
                        opacity: 0.7
                    });
                    const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                    
                    const radius = 2 + Math.random() * 3;
                    const angle = Math.random() * Math.PI * 2;
                    const height = (Math.random() - 0.5) * 2;
                    
                    particle.userData = {
                        radius: radius,
                        angle: angle,
                        speed: 0.5 + Math.random() * 0.5,
                        height: height,
                        heightSpeed: (Math.random() - 0.5) * 0.02
                    };
                    
                    this.group.add(particle);
                    this.particles.push(particle);
                }
                
                scene.add(this.group);
            }
            
            update(mouseInfluence) {
                this.time += 0.01;
                
                // Rotación del núcleo
                this.core.rotation.x += 0.02;
                this.core.rotation.y += 0.03;
                
                // Pulsación del núcleo
                const scale = 1 + Math.sin(this.time * 2) * 0.1;
                this.core.scale.set(scale, scale, scale);
                
                // Rotación de la flor completa
                this.group.rotation.z += 0.005;
                
                // Actualizar partículas
                this.particles.forEach(particle => {
                    particle.userData.angle += particle.userData.speed * 0.01;
                    particle.userData.height += particle.userData.heightSpeed;
                    
                    if(Math.abs(particle.userData.height) > 2) {
                        particle.userData.heightSpeed *= -1;
                    }
                    
                    const x = Math.cos(particle.userData.angle) * particle.userData.radius;
                    const z = Math.sin(particle.userData.angle) * particle.userData.radius;
                    const y = particle.userData.height;
                    
                    particle.position.set(x, y, z);
                    
                    // Influencia del mouse
                    if(mouseInfluence) {
                        const distance = particle.position.distanceTo(mouseInfluence);
                        if(distance < 5) {
                            const force = (5 - distance) / 5;
                            const direction = particle.position.clone().sub(mouseInfluence).normalize();
                            particle.position.add(direction.multiplyScalar(force * 0.1));
                        }
                    }
                });
            }
        }

        // Variables para el mouse
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let mouseWorld = null;

        // Event listeners
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const distance = -camera.position.z / raycaster.ray.direction.z;
            mouseWorld = camera.position.clone().add(
                raycaster.ray.direction.multiplyScalar(distance)
            );
        });

        window.addEventListener('click', (event) => {
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const flower = new CosmicFlower(x, y);
            cosmicFlowers.push(flower);
            
            // Limitar cantidad de flores
            if(cosmicFlowers.length > 15) {
                const oldFlower = cosmicFlowers.shift();
                scene.remove(oldFlower.group);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Crear algunas flores iniciales
        for(let i = 0; i < 5; i++) {
            setTimeout(() => {
                const x = (Math.random() - 0.5) * 2;
                const y = (Math.random() - 0.5) * 2;
                const flower = new CosmicFlower(x, y);
                cosmicFlowers.push(flower);
            }, i * 500);
        }

        // Animación
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotar estrellas de fondo
            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;
            
            // Actualizar flores
            cosmicFlowers.forEach(flower => {
                flower.update(mouseWorld);
            });
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
