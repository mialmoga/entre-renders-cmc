<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Tidal Ecosystem — ULTRA • Velvet × Claude</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  background: radial-gradient(ellipse at bottom, #0a1628 0%, #030508 100%);
  overflow: hidden;
  touch-action: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

canvas {
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  top: 15px;
  left: 15px;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(15px);
  color: #10a37f;
  padding: 16px 20px;
  border-radius: 16px;
  font-size: 13px;
  border: 1px solid rgba(16, 163, 127, 0.3);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  transition: transform 0.3s ease, opacity 0.3s ease;
  min-width: 200px;
}

#ui.hidden {
  transform: translateY(-20px);
  opacity: 0;
  pointer-events: none;
}

#ui h3 {
  margin: 0 0 12px 0;
  font-size: 15px;
  color: #00ffcc;
  text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
  letter-spacing: 1px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
  font-size: 12px;
}

.stat-value {
  color: #00ffcc;
  font-weight: bold;
  font-size: 14px;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(15px);
  padding: 14px 18px;
  border-radius: 16px;
  border: 1px solid rgba(16, 163, 127, 0.3);
  display: flex;
  gap: 10px;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  transition: transform 0.3s ease, opacity 0.3s ease;
  max-width: 90%;
}

.controls.hidden {
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
}

.button-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.spawn-mode {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 8px 0;
  border-top: 1px solid rgba(16, 163, 127, 0.2);
  margin-top: 4px;
}

.mode-label {
  font-size: 11px;
  color: #10a37f;
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  text-align: center;
}

button {
  background: linear-gradient(135deg, #10a37f, #0d8968);
  color: #000;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);
  touch-action: manipulation;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(16, 163, 127, 0.5);
}

button:active {
  transform: translateY(0);
}

button.active {
  background: linear-gradient(135deg, #00ffcc, #10a37f);
  color: #000;
  box-shadow: 0 0 20px rgba(0, 255, 204, 0.6), 0 4px 12px rgba(16, 163, 127, 0.5);
}

button.spawn-mode-btn {
  padding: 8px 14px;
  font-size: 12px;
}

.toggle-btn {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  z-index: 1000;
}

#time-indicator {
  position: fixed;
  top: 15px;
  right: 80px;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(15px);
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid rgba(16, 163, 127, 0.3);
  color: #00ffcc;
  font-size: 12px;
  font-weight: bold;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
}

@media (max-width: 768px) {
  #ui {
    font-size: 11px;
    padding: 12px 16px;
  }
  
  .controls {
    gap: 8px;
    padding: 10px 14px;
  }
  
  button {
    padding: 8px 12px;
    font-size: 11px;
  }
}
</style>

<body>

<canvas id="c"></canvas>

<div id="ui">
  <h3>🌊 TIDAL ECOSYSTEM</h3>
  <div class="stat-row">
    <span>🦠 Plancton:</span>
    <span class="stat-value" id="p">0</span>
  </div>
  <div class="stat-row">
    <span>🐟 Peces:</span>
    <span class="stat-value" id="f">0</span>
  </div>
  <div class="stat-row">
    <span>🦈 Depredador:</span>
    <span class="stat-value" id="pred">1</span>
  </div>
  <div class="stat-row">
    <span>🌊 Corrientes:</span>
    <span class="stat-value" id="curr">0</span>
  </div>
  <div class="stat-row">
    <span>⚡ Energía Total:</span>
    <span class="stat-value" id="energy">0</span>
  </div>
</div>

<div id="time-indicator">
  <span id="time-icon">☀️</span> <span id="time-text">DÍA</span>
</div>

<button class="toggle-btn" id="toggleBtn">👁️</button>

<div class="controls">
  <div class="mode-label">👆 Modo de Toque</div>
  <div class="spawn-mode">
    <button class="spawn-mode-btn active" id="modeNone">🌊 Corriente</button>
    <button class="spawn-mode-btn" id="modePlankton">🦠 Plancton</button>
    <button class="spawn-mode-btn" id="modeFish">🐟 Pez</button>
    <button class="spawn-mode-btn" id="modePredator">🦈 Depredador</button>
  </div>
  <div class="button-row">
    <button id="reset">🔄 Reset</button>
  </div>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
window.onresize = resize;

// ========= SPATIAL HASHING FOR PERFORMANCE =========
const GRID_SIZE = 100;
let grid = {};

function rebuildGrid() {
  grid = {};
}

function getGridKey(x, y) {
  const gx = Math.floor(x / GRID_SIZE);
  const gy = Math.floor(y / GRID_SIZE);
  return `${gx},${gy}`;
}

function getNearbyEntities(x, y, entities) {
  const nearby = [];
  const gx = Math.floor(x / GRID_SIZE);
  const gy = Math.floor(y / GRID_SIZE);
  
  for(let dx = -1; dx <= 1; dx++) {
    for(let dy = -1; dy <= 1; dy++) {
      const key = `${gx + dx},${gy + dy}`;
      if(grid[key]) {
        nearby.push(...grid[key]);
      }
    }
  }
  
  return nearby;
}

function updateGrid(entities) {
  grid = {};
  for(let e of entities) {
    const key = getGridKey(e.pos.x, e.pos.y);
    if(!grid[key]) grid[key] = [];
    grid[key].push(e);
  }
}

// ========= TIME SYSTEM =========
let gameTime = 0;
let dayNightCycle = 0; // 0 = day, 1 = night

function updateDayNight() {
  gameTime += 0.0005;
  dayNightCycle = (Math.sin(gameTime) + 1) / 2; // 0 to 1
  
  const isDay = dayNightCycle < 0.5;
  document.getElementById('time-icon').textContent = isDay ? '☀️' : '🌙';
  document.getElementById('time-text').textContent = isDay ? 'DÍA' : 'NOCHE';
}

// ========= ENTITIES =========
const plankton = [];
const fish = [];
const predators = [];
const currents = [];
const particles = []; // Visual particles

class Vec {
  constructor(x, y) {
    this.x = x;
    this.y = y;
  }
  add(v) {
    this.x += v.x;
    this.y += v.y;
  }
  mul(n) {
    this.x *= n;
    this.y *= n;
  }
  mag() {
    return Math.hypot(this.x, this.y);
  }
  normalize() {
    const m = this.mag();
    if(m > 0) {
      this.x /= m;
      this.y /= m;
    }
    return this;
  }
  limit(max) {
    const m = this.mag();
    if(m > max) {
      this.normalize();
      this.mul(max);
    }
  }
}

function rand(a, b) {
  return Math.random() * (b - a) + a;
}

// ========= PLANKTON =========
class Plankton {
  constructor(x, y) {
    this.pos = new Vec(x || rand(0, W), y || rand(0, H));
    this.vel = new Vec(rand(-0.3, 0.3), rand(-0.3, 0.3));
    this.life = 1.0;
    this.size = rand(1.5, 3);
  }
  
  update() {
    // Drift
    this.vel.x += (Math.random() - 0.5) * 0.02;
    this.vel.y += (Math.random() - 0.5) * 0.02;
    
    // Current influence
    for(let c of currents) {
      const dx = this.pos.x - c.x;
      const dy = this.pos.y - c.y;
      const dist = Math.hypot(dx, dy);
      
      if(dist < c.radius) {
        const force = (c.radius - dist) / c.radius;
        this.vel.x += c.vx * force * 0.1;
        this.vel.y += c.vy * force * 0.1;
      }
    }
    
    this.vel.mul(0.99);
    this.vel.limit(2);
    this.pos.add(this.vel);
    
    // Wrap around
    if(this.pos.x < 0) this.pos.x = W;
    if(this.pos.x > W) this.pos.x = 0;
    if(this.pos.y < 0) this.pos.y = H;
    if(this.pos.y > H) this.pos.y = 0;
    
    this.life -= 0.0005;
  }
  
  draw() {
    const alpha = this.life * (0.5 + dayNightCycle * 0.5);
    
    // Glow
    ctx.shadowBlur = 8 * dayNightCycle;
    ctx.shadowColor = '#10a37f';
    
    ctx.fillStyle = `rgba(16, 163, 127, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
  }
}

// ========= FISH (with BOIDS) =========
class Fish {
  constructor(x, y) {
    this.pos = new Vec(x || rand(0, W), y || rand(0, H));
    this.vel = new Vec(rand(-1, 1), rand(-1, 1));
    this.acc = new Vec(0, 0);
    this.energy = 200;
    this.maxSpeed = 3;
    this.maxForce = 0.1;
    this.visionRange = 80;
    this.angle = 0;
  }
  
  applyForce(force) {
    this.acc.add(force);
  }
  
  // BOIDS: Separation
  separate(neighbors) {
    const desiredSeparation = 25;
    let steer = new Vec(0, 0);
    let count = 0;
    
    for(let other of neighbors) {
      if(other === this) continue;
      const d = Math.hypot(this.pos.x - other.pos.x, this.pos.y - other.pos.y);
      
      if(d > 0 && d < desiredSeparation) {
        const diff = new Vec(this.pos.x - other.pos.x, this.pos.y - other.pos.y);
        diff.normalize();
        diff.mul(1 / d);
        steer.add(diff);
        count++;
      }
    }
    
    if(count > 0) {
      steer.mul(1 / count);
      steer.normalize();
      steer.mul(this.maxSpeed);
      steer.x -= this.vel.x;
      steer.y -= this.vel.y;
      steer.limit(this.maxForce);
    }
    
    return steer;
  }
  
  // BOIDS: Alignment
  align(neighbors) {
    const neighborDist = 50;
    let sum = new Vec(0, 0);
    let count = 0;
    
    for(let other of neighbors) {
      if(other === this) continue;
      const d = Math.hypot(this.pos.x - other.pos.x, this.pos.y - other.pos.y);
      
      if(d > 0 && d < neighborDist) {
        sum.add(other.vel);
        count++;
      }
    }
    
    if(count > 0) {
      sum.mul(1 / count);
      sum.normalize();
      sum.mul(this.maxSpeed);
      
      const steer = new Vec(sum.x - this.vel.x, sum.y - this.vel.y);
      steer.limit(this.maxForce);
      return steer;
    }
    
    return new Vec(0, 0);
  }
  
  // BOIDS: Cohesion
  cohesion(neighbors) {
    const neighborDist = 50;
    let sum = new Vec(0, 0);
    let count = 0;
    
    for(let other of neighbors) {
      if(other === this) continue;
      const d = Math.hypot(this.pos.x - other.pos.x, this.pos.y - other.pos.y);
      
      if(d > 0 && d < neighborDist) {
        sum.add(other.pos);
        count++;
      }
    }
    
    if(count > 0) {
      sum.mul(1 / count);
      return this.seek(sum);
    }
    
    return new Vec(0, 0);
  }
  
  seek(target) {
    const desired = new Vec(target.x - this.pos.x, target.y - this.pos.y);
    desired.normalize();
    desired.mul(this.maxSpeed);
    
    const steer = new Vec(desired.x - this.vel.x, desired.y - this.vel.y);
    steer.limit(this.maxForce);
    return steer;
  }
  
  update() {
    // Hunt plankton
    let nearestPlankton = null;
    let minDist = Infinity;
    
    const nearbyPlankton = getNearbyEntities(this.pos.x, this.pos.y, plankton);
    
    for(let p of nearbyPlankton) {
      const d = Math.hypot(this.pos.x - p.pos.x, this.pos.y - p.pos.y);
      if(d < minDist && d < this.visionRange) {
        minDist = d;
        nearestPlankton = p;
      }
    }
    
    if(nearestPlankton) {
      const hunt = this.seek(nearestPlankton.pos);
      hunt.mul(1.5); // Hunting is priority
      this.applyForce(hunt);
      
      // Eat if close
      if(minDist < 8) {
        const idx = plankton.indexOf(nearestPlankton);
        if(idx !== -1) {
          plankton.splice(idx, 1);
          this.energy += 60;
          
          // Particle effect
          for(let i = 0; i < 5; i++) {
            particles.push({
              x: nearestPlankton.pos.x,
              y: nearestPlankton.pos.y,
              vx: rand(-2, 2),
              vy: rand(-2, 2),
              life: 1.0,
              color: '#10a37f'
            });
          }
        }
      }
    }
    
    // Boids behavior with nearby fish
    const neighbors = getNearbyEntities(this.pos.x, this.pos.y, fish);
    
    const sep = this.separate(neighbors);
    const ali = this.align(neighbors);
    const coh = this.cohesion(neighbors);
    
    sep.mul(1.5);
    ali.mul(1.0);
    coh.mul(1.0);
    
    this.applyForce(sep);
    this.applyForce(ali);
    this.applyForce(coh);
    
    // Current influence
    for(let c of currents) {
      const dx = this.pos.x - c.x;
      const dy = this.pos.y - c.y;
      const dist = Math.hypot(dx, dy);
      
      if(dist < c.radius) {
        const force = (c.radius - dist) / c.radius;
        this.applyForce(new Vec(c.vx * force * 0.3, c.vy * force * 0.3));
      }
    }
    
    // Day/Night behavior
    if(dayNightCycle > 0.5) {
      // Night: slower, less active
      this.maxSpeed = 2;
    } else {
      // Day: normal speed
      this.maxSpeed = 3;
    }
    
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mul(0);
    
    // Wrap around
    if(this.pos.x < 0) this.pos.x = W;
    if(this.pos.x > W) this.pos.x = 0;
    if(this.pos.y < 0) this.pos.y = H;
    if(this.pos.y > H) this.pos.y = 0;
    
    this.energy -= 0.5;
    
    // Reproduce
    if(this.energy > 400 && fish.length < 100) {
      fish.push(new Fish(this.pos.x, this.pos.y));
      this.energy = 200;
    }
    
    // Calculate angle for rendering
    this.angle = Math.atan2(this.vel.y, this.vel.x);
  }
  
  draw() {
    const brightness = 0.6 + dayNightCycle * 0.4;
    
    ctx.save();
    ctx.translate(this.pos.x, this.pos.y);
    ctx.rotate(this.angle);
    
    // Glow
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#00bcd4';
    
    // Triangle fish
    ctx.fillStyle = `rgba(0, 188, 212, ${brightness})`;
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(-6, 4);
    ctx.lineTo(-6, -4);
    ctx.closePath();
    ctx.fill();
    
    // Tail
    ctx.fillStyle = `rgba(0, 188, 212, ${brightness * 0.7})`;
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-10, 3);
    ctx.lineTo(-10, -3);
    ctx.closePath();
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ========= PREDATOR =========
class Predator extends Fish {
  constructor() {
    super(W / 2, H / 2);
    this.energy = 500;
    this.maxSpeed = 4;
    this.visionRange = 150;
    this.size = 15;
  }
  
  update() {
    // Hunt fish
    let nearestFish = null;
    let minDist = Infinity;
    
    const nearbyFish = getNearbyEntities(this.pos.x, this.pos.y, fish);
    
    for(let f of nearbyFish) {
      const d = Math.hypot(this.pos.x - f.pos.x, this.pos.y - f.pos.y);
      if(d < minDist && d < this.visionRange) {
        minDist = d;
        nearestFish = f;
      }
    }
    
    if(nearestFish) {
      const hunt = this.seek(nearestFish.pos);
      hunt.mul(2.0);
      this.applyForce(hunt);
      
      // Eat if close
      if(minDist < 15) {
        const idx = fish.indexOf(nearestFish);
        if(idx !== -1) {
          fish.splice(idx, 1);
          this.energy += 100;
          
          // Blood particles
          for(let i = 0; i < 10; i++) {
            particles.push({
              x: nearestFish.pos.x,
              y: nearestFish.pos.y,
              vx: rand(-3, 3),
              vy: rand(-3, 3),
              life: 1.0,
              color: '#ff3d6e'
            });
          }
        }
      }
    }
    
    // Current influence
    for(let c of currents) {
      const dx = this.pos.x - c.x;
      const dy = this.pos.y - c.y;
      const dist = Math.hypot(dx, dy);
      
      if(dist < c.radius) {
        const force = (c.radius - dist) / c.radius;
        this.applyForce(new Vec(c.vx * force * 0.2, c.vy * force * 0.2));
      }
    }
    
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mul(0);
    
    // Wrap around
    if(this.pos.x < 0) this.pos.x = W;
    if(this.pos.x > W) this.pos.x = 0;
    if(this.pos.y < 0) this.pos.y = H;
    if(this.pos.y > H) this.pos.y = 0;
    
    this.energy -= 0.3;
    
    this.angle = Math.atan2(this.vel.y, this.vel.x);
  }
  
  draw() {
    ctx.save();
    ctx.translate(this.pos.x, this.pos.y);
    ctx.rotate(this.angle);
    
    // Predator glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff3d6e';
    
    // Diamond/shark shape
    ctx.fillStyle = '#ff3d6e';
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(0, 6);
    ctx.lineTo(-8, 0);
    ctx.lineTo(0, -6);
    ctx.closePath();
    ctx.fill();
    
    // Eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(4, 0, 2, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ========= CURRENT =========
class Current {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.radius = 150;
    this.life = 1.0;
  }
  
  update() {
    this.life -= 0.01;
  }
  
  draw() {
    if(this.life <= 0) return;
    
    const alpha = this.life * 0.3;
    
    // Ripple effect
    ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * (1 - this.life), 0, Math.PI * 2);
    ctx.stroke();
    
    // Flow lines
    const mag = Math.hypot(this.vx, this.vy);
    if(mag > 0.1) {
      ctx.strokeStyle = `rgba(0, 255, 255, ${alpha * 0.5})`;
      ctx.lineWidth = 1;
      
      for(let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const x1 = this.x + Math.cos(angle) * 20;
        const y1 = this.y + Math.sin(angle) * 20;
        const x2 = x1 + this.vx * 30;
        const y2 = y1 + this.vy * 30;
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
  }
}

// ========= INITIALIZATION =========
for(let i = 0; i < 100; i++) plankton.push(new Plankton());
for(let i = 0; i < 15; i++) fish.push(new Fish());
predators.push(new Predator());

// ========= INPUT =========
let pointer = null;
let lastPointer = null;
let spawnMode = 'none'; // 'none', 'plankton', 'fish', 'predator'

function handlePointerStart(e) {
  if(e.target.closest('#ui') || e.target.closest('.controls') || e.target.closest('.toggle-btn') || e.target.closest('#time-indicator')) return;
  
  const x = e.clientX;
  const y = e.clientY;
  
  // Spawn entity based on mode
  if(spawnMode === 'plankton') {
    for(let i = 0; i < 5; i++) {
      plankton.push(new Plankton(x + rand(-20, 20), y + rand(-20, 20)));
    }
  } else if(spawnMode === 'fish') {
    fish.push(new Fish(x, y));
  } else if(spawnMode === 'predator') {
    predators.push(new Predator());
    predators[predators.length - 1].pos.x = x;
    predators[predators.length - 1].pos.y = y;
  } else {
    // Current mode
    pointer = { x, y };
    lastPointer = { x, y };
  }
}

function handlePointerMove(e) {
  if(pointer && spawnMode === 'none') {
    const current = { x: e.clientX, y: e.clientY };
    const vx = (current.x - lastPointer.x) * 0.5;
    const vy = (current.y - lastPointer.y) * 0.5;
    
    currents.push(new Current(current.x, current.y, vx, vy));
    
    lastPointer = current;
  }
}

function handlePointerEnd() {
  pointer = null;
  lastPointer = null;
}

canvas.addEventListener('pointerdown', handlePointerStart);
canvas.addEventListener('pointermove', handlePointerMove);
canvas.addEventListener('pointerup', handlePointerEnd);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if(e.touches.length > 0) {
    const touch = e.touches[0];
    handlePointerStart({ clientX: touch.clientX, clientY: touch.clientY, target: e.target });
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if(e.touches.length > 0) {
    const touch = e.touches[0];
    handlePointerMove({ clientX: touch.clientX, clientY: touch.clientY });
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  handlePointerEnd();
}, { passive: false });

// ========= UI CONTROLS =========
let uiVisible = true;

document.getElementById('toggleBtn').addEventListener('click', () => {
  uiVisible = !uiVisible;
  document.getElementById('ui').classList.toggle('hidden');
  document.querySelector('.controls').classList.toggle('hidden');
});

// Spawn mode buttons
function setSpawnMode(mode) {
  spawnMode = mode;
  
  // Update button states
  document.querySelectorAll('.spawn-mode-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  if(mode === 'none') {
    document.getElementById('modeNone').classList.add('active');
  } else if(mode === 'plankton') {
    document.getElementById('modePlankton').classList.add('active');
  } else if(mode === 'fish') {
    document.getElementById('modeFish').classList.add('active');
  } else if(mode === 'predator') {
    document.getElementById('modePredator').classList.add('active');
  }
}

document.getElementById('modeNone').addEventListener('click', () => setSpawnMode('none'));
document.getElementById('modePlankton').addEventListener('click', () => setSpawnMode('plankton'));
document.getElementById('modeFish').addEventListener('click', () => setSpawnMode('fish'));
document.getElementById('modePredator').addEventListener('click', () => setSpawnMode('predator'));

document.getElementById('reset').addEventListener('click', () => {
  plankton.length = 0;
  fish.length = 0;
  predators.length = 0;
  currents.length = 0;
  particles.length = 0;
  
  for(let i = 0; i < 100; i++) plankton.push(new Plankton());
  for(let i = 0; i < 15; i++) fish.push(new Fish());
  predators.push(new Predator());
});

// ========= MAIN LOOP =========
function loop() {
  // Background with day/night
  const bgAlpha = 0.15 + dayNightCycle * 0.1;
  ctx.fillStyle = `rgba(3, 5, 8, ${bgAlpha})`;
  ctx.fillRect(0, 0, W, H);
  
  // Spawn plankton
  if(Math.random() < 0.02 && plankton.length < 200) {
    plankton.push(new Plankton());
  }
  
  // Update day/night
  updateDayNight();
  
  // Update spatial grid
  updateGrid([...plankton, ...fish]);
  
  // Update and draw plankton
  for(let i = plankton.length - 1; i >= 0; i--) {
    plankton[i].update();
    plankton[i].draw();
    
    if(plankton[i].life <= 0) {
      plankton.splice(i, 1);
    }
  }
  
  // Update and draw fish
  for(let i = fish.length - 1; i >= 0; i--) {
    fish[i].update();
    fish[i].draw();
    
    if(fish[i].energy <= 0) {
      fish.splice(i, 1);
    }
  }
  
  // Update and draw predators
  for(let i = predators.length - 1; i >= 0; i--) {
    predators[i].update();
    predators[i].draw();
    
    if(predators[i].energy <= 0) {
      predators.splice(i, 1);
      // Respawn predator if extinct
      if(predators.length === 0) {
        predators.push(new Predator());
      }
    }
  }
  
  // Update and draw currents
  for(let i = currents.length - 1; i >= 0; i--) {
    currents[i].update();
    currents[i].draw();
    
    if(currents[i].life <= 0) {
      currents.splice(i, 1);
    }
  }
  
  // Update and draw particles
  for(let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= 0.02;
    
    if(p.life > 0) {
      ctx.fillStyle = `rgba(${p.color === '#10a37f' ? '16, 163, 127' : '255, 61, 110'}, ${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      particles.splice(i, 1);
    }
  }
  
  // Update stats
  document.getElementById('p').textContent = plankton.length;
  document.getElementById('f').textContent = fish.length;
  document.getElementById('pred').textContent = predators.length;
  document.getElementById('curr').textContent = currents.length;
  
  const totalEnergy = fish.reduce((sum, f) => sum + f.energy, 0) + 
                      predators.reduce((sum, p) => sum + p.energy, 0);
  document.getElementById('energy').textContent = Math.floor(totalEnergy);
  
  requestAnimationFrame(loop);
}

loop();
</script>
